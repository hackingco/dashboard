version: '3.8'

services:
  # PostgreSQL Database for Langfuse
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_secret
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-langfuse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - langfuse-network

  # Langfuse Server (using v2 for compatibility)
  langfuse-server:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_secret@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3050
      NEXTAUTH_SECRET: langfuse_nextauth_secret_change_in_production
      SALT: langfuse_salt_change_in_production
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: langfuse_encryption_key_change_in_production
    ports:
      - "3050:3000"
    volumes:
      - langfuse_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - langfuse-network

  # Swarm Manager Service
  swarm-manager:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: manager
    restart: unless-stopped
    depends_on:
      langfuse-server:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890abcdef
      LANGFUSE_SECRET_KEY: sk-lf-fedcba0987654321
      LANGFUSE_HOST: http://langfuse-server:3000
      SWARM_ID: docker-test-swarm
      AGENT_ID: manager-001
      AGENT_ROLE: manager
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      LANGFUSE_LOG_LEVEL: debug
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - swarm_data:/app/data
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Swarm Worker Service 1
  swarm-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: worker
    restart: unless-stopped
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890abcdef
      LANGFUSE_SECRET_KEY: sk-lf-fedcba0987654321
      LANGFUSE_HOST: http://langfuse-server:3000
      SWARM_ID: docker-test-swarm
      AGENT_ID: worker-001
      AGENT_ROLE: worker
      MANAGER_URL: http://swarm-manager:8001
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      LANGFUSE_LOG_LEVEL: debug
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - swarm_data:/app/data
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
    networks:
      - langfuse-network

  # Swarm Worker Service 2
  swarm-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: worker
    restart: unless-stopped
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890abcdef
      LANGFUSE_SECRET_KEY: sk-lf-fedcba0987654321
      LANGFUSE_HOST: http://langfuse-server:3000
      SWARM_ID: docker-test-swarm
      AGENT_ID: worker-002
      AGENT_ROLE: worker
      MANAGER_URL: http://swarm-manager:8001
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      LANGFUSE_LOG_LEVEL: debug
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      PORT: 8003
    ports:
      - "8003:8003"
    volumes:
      - swarm_data:/app/data
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
    networks:
      - langfuse-network

  # Test Runner Service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: test-runner
    depends_on:
      langfuse-server:
        condition: service_healthy
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: test
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890abcdef
      LANGFUSE_SECRET_KEY: sk-lf-fedcba0987654321
      LANGFUSE_HOST: http://langfuse-server:3000
      SWARM_ID: docker-test-swarm
      AGENT_ID: test-runner
      AGENT_ROLE: tester
      MANAGER_URL: http://swarm-manager:8001
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      LANGFUSE_LOG_LEVEL: debug
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      LANGFUSE_VERBOSE_TRACING: "true"
    volumes:
      - swarm_data:/app/data
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
      - ./tests:/app/tests:ro
    networks:
      - langfuse-network
    profiles:
      - testing

  # Redis for caching and coordination
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_secret
    environment:
      REDIS_PASSWORD: redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langfuse-network

  # Monitoring and Observability
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - langfuse-network
    profiles:
      - monitoring

  # Grafana for visualizations
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_secret
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - langfuse-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  langfuse_data:
    driver: local
  swarm_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  langfuse-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16