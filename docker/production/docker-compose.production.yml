version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service,swarm"

x-deploy-policy: &default-deploy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 60s
    max_failure_ratio: 0.3

services:
  # PostgreSQL Database Cluster
  postgres-primary:
    image: postgres:15-alpine
    restart: unless-stopped
    hostname: postgres-primary
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Replication settings
      POSTGRES_REPLICATION_MODE: master
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./config/postgres/init-langfuse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./config/postgres/production-tuning.sql:/docker-entrypoint-initdb.d/02-tuning.sql:ro
      - ./config/postgres/replication-setup.sql:/docker-entrypoint-initdb.d/03-replication.sql:ro
    networks:
      swarm-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  postgres-replica:
    image: postgres:15-alpine
    restart: unless-stopped
    hostname: postgres-replica
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_REPLICATION_MODE: slave
      POSTGRES_MASTER_SERVICE: postgres-primary
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres-primary
      DATABASES_PORT: 5432
      DATABASES_USER: ${LANGFUSE_DB_USER:-langfuse}
      DATABASES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      DATABASES_DBNAME: ${LANGFUSE_DB_NAME:-langfuse}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 25
      RESERVE_POOL_TIMEOUT: 3
      SERVER_LIFETIME: 600
      SERVER_IDLE_TIMEOUT: 60
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # Redis Cluster
  redis-master:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: redis-master
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    volumes:
      - redis_master_data:/data
      - ./config/redis/production.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      swarm-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  redis-replica:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: redis-replica
    command: >
      redis-server
      --replicaof redis-master 6379
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_replica_data:/data
    depends_on:
      - redis-master
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    logging: *default-logging

  # Langfuse Server Cluster
  langfuse-server-1:
    image: langfuse/langfuse:2
    restart: unless-stopped
    hostname: langfuse-1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@pgbouncer:5432/${LANGFUSE_DB_NAME:-langfuse}?pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@postgres-primary:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-https://langfuse.yourdomain.com}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      LANGFUSE_DEFAULT_PROJECT_ID: ${LANGFUSE_DEFAULT_PROJECT_ID}
      LANGFUSE_DEFAULT_PROJECT_SECRET: ${LANGFUSE_DEFAULT_PROJECT_SECRET}
      # Production optimizations
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
      # Redis for caching
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
      # Security
      LANGFUSE_CSP_ENFORCE_HTTPS: "true"
      LANGFUSE_ALLOWED_ORIGINS: ${LANGFUSE_ALLOWED_ORIGINS}
      # Clustering
      INSTANCE_ID: langfuse-1
    volumes:
      - langfuse_data:/app/data
      - langfuse_uploads:/app/uploads
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  langfuse-server-2:
    image: langfuse/langfuse:2
    restart: unless-stopped
    hostname: langfuse-2
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@pgbouncer:5432/${LANGFUSE_DB_NAME:-langfuse}?pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@postgres-primary:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-https://langfuse.yourdomain.com}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      LANGFUSE_DEFAULT_PROJECT_ID: ${LANGFUSE_DEFAULT_PROJECT_ID}
      LANGFUSE_DEFAULT_PROJECT_SECRET: ${LANGFUSE_DEFAULT_PROJECT_SECRET}
      # Production optimizations
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
      # Redis for caching
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
      # Security
      LANGFUSE_CSP_ENFORCE_HTTPS: "true"
      LANGFUSE_ALLOWED_ORIGINS: ${LANGFUSE_ALLOWED_ORIGINS}
      # Clustering
      INSTANCE_ID: langfuse-2
    volumes:
      - langfuse_data:/app/data
      - langfuse_uploads:/app/uploads
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  # HAProxy Load Balancer
  haproxy:
    image: haproxy:2.8-alpine
    restart: unless-stopped
    hostname: haproxy
    depends_on:
      - langfuse-server-1
      - langfuse-server-2
      - swarm-manager
      - swarm-worker-1
      - swarm-worker-2
      - swarm-worker-3
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./config/haproxy/haproxy-production.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./config/ssl:/etc/ssl/certs:ro
      - haproxy_socket:/var/run/haproxy
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8404/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # Nginx Web Server (Static Assets & Caching)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    hostname: nginx
    depends_on:
      - haproxy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./config/nginx/nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - static_assets:/usr/share/nginx/html
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # Swarm Manager (Production)
  swarm-manager:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.manager
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
    image: swarm-manager:${VERSION:-latest}
    restart: unless-stopped
    hostname: swarm-manager
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      haproxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024 --enable-source-maps"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://haproxy/langfuse
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: manager-001
      AGENT_ROLE: manager
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/1
      REDIS_REPLICA_URL: redis://:${REDIS_PASSWORD}@redis-replica:6379/1
      
      # Database (for manager state)
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@pgbouncer:5432/${LANGFUSE_DB_NAME:-langfuse}_manager?pgbouncer=true
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      
      # Logging and Monitoring
      LANGFUSE_LOG_LEVEL: ${LOG_LEVEL:-info}
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      LANGFUSE_ENABLE_PROFILING: ${ENABLE_PROFILING:-false}
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${MANAGER_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      
      # Performance
      MAX_WORKERS: ${MAX_WORKERS:-8}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300}
      WORKER_MEMORY_LIMIT: ${WORKER_MEMORY_LIMIT:-512}
      
      PORT: 8001
      METRICS_PORT: 9001
    ports:
      - "${MANAGER_PORT:-8001}:8001"
      - "${MANAGER_METRICS_PORT:-9001}:9001"
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      <<: *default-deploy
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    labels:
      - "swarm.role=manager"
      - "swarm.type=coordinator"
      - "prometheus.scrape=true"
      - "prometheus.port=9001"
    logging: *default-logging

  # Swarm Workers (Auto-scaling group)
  swarm-worker-1:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.worker
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
    image: swarm-worker:${VERSION:-latest}
    restart: unless-stopped
    hostname: swarm-worker-1
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512 --enable-source-maps"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://haproxy/langfuse
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-001
      AGENT_ROLE: coder
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/2
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_1_SPECIALIZATION:-general}
      WORKER_CAPACITY: ${WORKER_1_CAPACITY:-10}
      WORKER_TAGS: "coder,general,api"
      
      PORT: 8002
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      replicas: ${WORKER_1_REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "swarm.role=worker"
      - "swarm.type=coder"
      - "swarm.scaling=auto"
    logging: *default-logging

  swarm-worker-2:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.worker
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
    image: swarm-worker:${VERSION:-latest}
    restart: unless-stopped
    hostname: swarm-worker-2
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512 --enable-source-maps"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://haproxy/langfuse
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-002
      AGENT_ROLE: analyst
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/3
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_2_SPECIALIZATION:-analysis}
      WORKER_CAPACITY: ${WORKER_2_CAPACITY:-8}
      WORKER_TAGS: "analyst,data,performance"
      
      PORT: 8003
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      replicas: ${WORKER_2_REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "swarm.role=worker"
      - "swarm.type=analyst"
      - "swarm.scaling=auto"
    logging: *default-logging

  swarm-worker-3:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.worker
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
    image: swarm-worker:${VERSION:-latest}
    restart: unless-stopped
    hostname: swarm-worker-3
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512 --enable-source-maps"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://haproxy/langfuse
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-003
      AGENT_ROLE: tester
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/4
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_3_SPECIALIZATION:-testing}
      WORKER_CAPACITY: ${WORKER_3_CAPACITY:-6}
      WORKER_TAGS: "tester,quality,validation"
      
      PORT: 8004
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      replicas: ${WORKER_3_REPLICAS:-1}
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "swarm.role=worker"
      - "swarm.type=tester"
      - "swarm.scaling=auto"
    logging: *default-logging

  # Dashboard Service
  dashboard:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.dashboard
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-yourdomain.com}/api
        - NEXT_PUBLIC_LANGFUSE_HOST=https://${DOMAIN:-yourdomain.com}/langfuse
    image: swarm-dashboard:${VERSION:-latest}
    restart: unless-stopped
    hostname: dashboard
    depends_on:
      - swarm-manager
      - haproxy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-yourdomain.com}/api
      NEXT_PUBLIC_LANGFUSE_HOST: https://${DOMAIN:-yourdomain.com}/langfuse
      API_URL: http://swarm-manager:8001
      PORT: 3000
    volumes:
      - dashboard_cache:/app/.next/cache
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      <<: *default-deploy
      replicas: ${DASHBOARD_REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "swarm.role=frontend"
      - "swarm.type=dashboard"
    logging: *default-logging

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus-production.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts-production.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - swarm-network
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-yourdomain.com}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-redis-datasource,postgres-datasource}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - swarm-network
    depends_on:
      - prometheus
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    hostname: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-production.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - swarm-network
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    hostname: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-production.yaml:/etc/promtail/config.yml:ro
      - swarm_logs:/app/logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - swarm-network
    depends_on:
      - loki
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    hostname: alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${DOMAIN:-yourdomain.com}/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - swarm-network
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  # Node Exporter (on each host)
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - swarm-network
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  # Backup Service
  backup:
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    hostname: backup
    environment:
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON:-0 2 * * *}"
      BACKUP_FILENAME: "swarm-backup-%Y-%m-%d_%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "swarm-backup-"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      NOTIFICATION_URL: ${BACKUP_NOTIFICATION_URL}
    volumes:
      - postgres_primary_data:/backup/postgres:ro
      - langfuse_data:/backup/langfuse:ro
      - swarm_data:/backup/swarm:ro
      - redis_master_data:/backup/redis:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - swarm-network
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

volumes:
  # Database volumes
  postgres_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/postgres/primary
  
  postgres_replica_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/postgres/replica
  
  # Redis volumes
  redis_master_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/redis/master
  
  redis_replica_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/redis/replica
  
  # Application volumes
  langfuse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/langfuse
  
  langfuse_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/langfuse-uploads
  
  swarm_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/swarm
  
  swarm_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOG_DIR:-/logs}/swarm
  
  # Web server volumes
  nginx_cache:
    driver: local
  
  static_assets:
    driver: local
  
  haproxy_socket:
    driver: local
  
  dashboard_cache:
    driver: local
  
  # Monitoring volumes
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/grafana
  
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data}/loki
  
  alertmanager_data:
    driver: local

networks:
  swarm-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: swarm-prod
      com.docker.network.driver.mtu: 1500