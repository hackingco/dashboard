name: CI - Langfuse Wrapper

on:
  push:
    paths:
      - 'shared/langfuse-wrapper/**'
      - '.github/workflows/ci-langfuse-wrapper.yml'
  pull_request:
    paths:
      - 'shared/langfuse-wrapper/**'
      - '.github/workflows/ci-langfuse-wrapper.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd shared/langfuse-wrapper
        npm ci
    
    - name: Run linter
      run: |
        cd shared/langfuse-wrapper
        npm run lint
    
    - name: Run type checking
      run: |
        cd shared/langfuse-wrapper
        npm run typecheck
    
    - name: Run unit tests
      run: |
        cd shared/langfuse-wrapper
        npm run test:unit
      env:
        LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY_TEST }}
        LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY_TEST }}
    
    - name: Run integration tests
      run: |
        cd shared/langfuse-wrapper
        npm run test:integration
      env:
        LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY_TEST }}
        LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY_TEST }}
    
    - name: Run test coverage
      run: |
        cd shared/langfuse-wrapper
        npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./shared/langfuse-wrapper/coverage
        flags: langfuse-wrapper
        name: langfuse-wrapper-coverage
    
    - name: Build package
      run: |
        cd shared/langfuse-wrapper
        npm run build
    
    - name: Check package size
      run: |
        cd shared/langfuse-wrapper
        npm pack --dry-run

  performance:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd shared/langfuse-wrapper
        npm ci
    
    - name: Run performance tests
      run: |
        cd shared/langfuse-wrapper
        npm run test tests/integration/performance.test.ts
      env:
        NODE_OPTIONS: "--expose-gc"
    
    - name: Store performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: shared/langfuse-wrapper/performance-results.json

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: [test, performance]
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        registry-url: https://registry.npmjs.org/
    
    - name: Install and build
      run: |
        cd shared/langfuse-wrapper
        npm ci
        npm run build
    
    - name: Dry run publish
      run: |
        cd shared/langfuse-wrapper
        npm publish --dry-run