# Fly.io Configuration for Swarm Manager (Production)
# This is the core orchestration service for the swarm platform

app = "swarm-manager-prod"
primary_region = "ord"

[build]
  dockerfile = "../apps/manager/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  
  # Service URLs (internal network)
  LANGFUSE_BASEURL = "http://langfuse-swarm.internal:3000"
  REDIS_URL = "redis://default:@swarm-redis.internal:6379"
  POSTGRES_URL = "postgres://postgres:@swarm-postgres.internal:5432/langfuse"
  
  # Dashboard integration
  DASHBOARD_URL = "https://swarm-dashboard.fly.dev"
  CORS_ORIGIN = "https://swarm-dashboard.fly.dev"
  
  # Swarm coordination
  SWARM_COORDINATION_PATH = "/data/coordination"
  SWARM_MEMORY_PATH = "/data/memory"
  SWARM_LOGS_PATH = "/data/logs"
  
  # Performance settings
  UV_THREADPOOL_SIZE = "8"
  NODE_OPTIONS = "--max-old-space-size=1536"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# Health checks with proper timing for coordination
[[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  restart_limit = 0

[[services.http_checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "30s"
  method = "get"
  path = "/health"
  protocol = "http"
  tls_skip_verify = false

# Persistent storage for swarm coordination
[mounts]
  source = "manager_coordination"
  destination = "/data"
  processes = ["app"]

# Resource allocation for high availability
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Multi-region deployment
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[experimental]
  auto_rollback = true
  enable_consul = true

# Metrics for monitoring
[metrics]
  port = 9090
  path = "/metrics"

# Static assets (if any)
[[statics]]
  guest_path = "/app/public"
  url_prefix = "/static/"

# Auto-scaling configuration
[processes]
  app = "node dist/index.js"

# Regional settings
[placement]
  strategy = "spread"
  max_per_region = 2

# Network configuration
[network]
  strategy = "rolling"
  wait_timeout = "30s"

# Secrets that need to be set via `fly secrets set`
# SUPABASE_URL = "https://xxx.supabase.co"
# SUPABASE_SERVICE_KEY = "eyJhbGci..."
# FLY_API_TOKEN = "fo1_xxx"
# LANGFUSE_PUBLIC_KEY = "pk-lf-xxx"
# LANGFUSE_SECRET_KEY = "sk-lf-xxx"
# POSTGRES_PASSWORD = "secure-password"
# REDIS_PASSWORD = "redis-password"