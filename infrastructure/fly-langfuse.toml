# Fly.io Configuration for Langfuse Observability Service
# Dedicated instance for LLM observability and tracing

app = "langfuse-swarm"
primary_region = "ord"

[build]
  image = "langfuse/langfuse:latest"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  
  # Database connection (internal PostgreSQL)
  DATABASE_URL = "postgres://postgres:@swarm-postgres.internal:5432/langfuse"
  DIRECT_URL = "postgres://postgres:@swarm-postgres.internal:5432/langfuse"
  
  # Langfuse configuration
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES = "true"
  NEXTAUTH_URL = "https://langfuse-swarm.fly.dev"
  NEXTAUTH_SECRET = "auto-generated-secret"
  SALT = "auto-generated-salt"
  
  # Security settings
  ENCRYPTION_KEY = "auto-generated-encryption-key"
  LANGFUSE_CSP_ENFORCE_HTTPS = "true"
  
  # Feature flags
  LANGFUSE_DEFAULT_PROJECT_ID = "swarm-orchestration"
  LANGFUSE_DEFAULT_PROJECT_ROLE = "ADMIN"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

# Health checks for Langfuse
[[services.tcp_checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "45s"
  restart_limit = 0

[[services.http_checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "45s"
  method = "get"
  path = "/api/health"
  protocol = "http"
  tls_skip_verify = false

# Resource allocation for observability workload
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[experimental]
  auto_rollback = true

# Metrics for Langfuse monitoring
[metrics]
  port = 9091
  path = "/metrics"

# Process configuration
[processes]
  app = "pnpm start"

# Auto-scaling based on trace volume
[placement]
  strategy = "balanced"

# Network configuration for internal access
[network]
  strategy = "rolling"
  wait_timeout = "60s"

# Secrets that need to be set via `fly secrets set`
# DATABASE_URL = "postgres://user:pass@swarm-postgres.internal:5432/langfuse"
# NEXTAUTH_SECRET = "secure-random-string"
# SALT = "secure-salt-string"
# ENCRYPTION_KEY = "32-character-encryption-key"