# Prometheus configuration for Swarm monitoring
# Built by Builder-2 Agent for Enterprise Swarm Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'swarm-monitor'

rule_files:
  # - "swarm_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Swarm Manager monitoring
  - job_name: 'swarm-manager'
    static_configs:
      - targets: ['swarm-manager:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    params:
      format: ['prometheus']

  # Swarm Worker monitoring
  - job_name: 'swarm-worker'
    static_configs:
      - targets: ['swarm-worker:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    params:
      format: ['prometheus']

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # PostgreSQL monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Nginx monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  # Docker container monitoring
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Custom application metrics
  - job_name: 'swarm-custom-metrics'
    static_configs:
      - targets: ['swarm-manager:8080', 'swarm-worker:8080']
    metrics_path: '/custom-metrics'
    scrape_interval: 30s