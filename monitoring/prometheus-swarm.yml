# Prometheus configuration for Claude Flow Swarm monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    swarm_id: 'claude-flow-swarm'
    deployment: 'docker-compose'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ClickHouse monitoring
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    metrics_path: /metrics
    scrape_interval: 30s

  # Langfuse application monitoring
  - job_name: 'langfuse'
    static_configs:
      - targets: ['langfuse:3000']
    metrics_path: /api/health
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
EOF < /dev/null