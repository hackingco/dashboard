# Alert Rules for Swarm Management System
# Configure with your monitoring system (Prometheus, Grafana, etc.)

groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"dashboard|manager|worker"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"
          
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) 
          / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
          
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, 
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow response times on {{ $labels.service }}"
          description: "95th percentile response time is {{ $value }}s"

  - name: resource_utilization
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"
          
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes 
          / node_memory_MemTotal_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"
          
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"} 
          / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

  - name: fly_machines
    interval: 1m
    rules:
      - alert: LowMachineAvailability
        expr: |
          sum(fly_machine_status{state="started"}) 
          / sum(fly_machine_status) < 0.5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Low machine availability in swarm"
          description: "Only {{ $value | humanizePercentage }} of machines are running"
          
      - alert: MachineCreationFailures
        expr: |
          rate(fly_machine_operations_total{operation="create",status="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High machine creation failure rate"
          description: "{{ $value }} machine creations per second are failing"
          
      - alert: SwarmScalingIssue
        expr: |
          abs(swarm_desired_count - swarm_actual_count) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Swarm scaling mismatch"
          description: "Desired: {{ $labels.desired }}, Actual: {{ $labels.actual }}"

  - name: database_health
    interval: 30s
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_database_numbackends 
          / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Database connection pool near limit"
          description: "{{ $value | humanizePercentage }} of connections in use"
          
      - alert: SlowDatabaseQueries
        expr: |
          rate(pg_stat_statements_mean_time_seconds[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}s"
          
      - alert: DatabaseReplicationLag
        expr: |
          pg_replication_lag_seconds > 10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High database replication lag"
          description: "Replication lag is {{ $value }}s"

  - name: redis_health
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis has been unavailable for more than 2 minutes"
          
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes 
          / redis_memory_max_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"
          
      - alert: RedisSlowCommands
        expr: |
          rate(redis_slowlog_length[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis experiencing slow commands"
          description: "{{ $value }} slow commands per minute"

  - name: langfuse_monitoring
    interval: 30s
    rules:
      - alert: LangfuseDown
        expr: up{job="langfuse"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Langfuse server is down"
          description: "Langfuse has been unavailable for more than 1 minute"
          
      - alert: LangfuseHighTraceIngestionRate
        expr: rate(langfuse_traces_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "High trace ingestion rate"
          description: "Langfuse is ingesting {{ $value }} traces per second"
          
      - alert: LangfuseDBConnectionIssues
        expr: |
          langfuse_db_connections_active 
          / langfuse_db_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Langfuse database connection pool near limit"
          description: "{{ $value | humanizePercentage }} of database connections in use"
          
      - alert: LangfuseHighTokenUsage
        expr: rate(langfuse_tokens_total[5m]) > 10000
        for: 10m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "High token processing rate"
          description: "Processing {{ $value }} tokens per second"
          
      - alert: LangfuseTraceProcessingBacklog
        expr: langfuse_trace_queue_size > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Langfuse trace processing backlog"
          description: "{{ $value }} traces in processing queue"

  - name: swarm_coordination
    interval: 30s
    rules:
      - alert: SwarmManagerDown
        expr: up{job="swarm-manager"} == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Swarm manager is down"
          description: "Swarm coordination manager is unavailable"
          
      - alert: SwarmWorkerDown
        expr: up{job=~"swarm-worker.*"} == 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Swarm worker {{ $labels.instance }} is down"
          description: "Worker {{ $labels.instance }} has been down for more than 1 minute"
          
      - alert: SwarmHighTaskFailureRate
        expr: rate(swarm_tasks_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High swarm task failure rate"
          description: "{{ $value }} task failures per second"
          
      - alert: SwarmLowWorkerCapacity
        expr: |
          swarm_workers_available 
          / swarm_workers_total < 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low swarm worker capacity"
          description: "Only {{ $value | humanizePercentage }} of workers available"
          
      - alert: SwarmCoordinationMemoryHigh
        expr: swarm_memory_db_size_bytes > 100000000  # 100MB
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Swarm coordination memory usage high"
          description: "Memory database size is {{ $value | humanizeBytes }}"

  - name: load_balancer_monitoring
    interval: 30s
    rules:
      - alert: LoadBalancerDown
        expr: up{job="haproxy"} == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Load balancer is down"
          description: "HAProxy load balancer is unavailable"
          
      - alert: LoadBalancerBackendDown
        expr: haproxy_server_up == 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Load balancer backend {{ $labels.server }} is down"
          description: "Backend server in {{ $labels.proxy }} is unavailable"
          
      - alert: LoadBalancerHighErrorRate
        expr: |
          rate(haproxy_server_http_responses_total{code=~"5.."}[5m]) 
          / rate(haproxy_server_http_responses_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate on load balancer backend"
          description: "{{ $value | humanizePercentage }} error rate on {{ $labels.server }}"

  - name: security_monitoring
    interval: 30s
    rules:
      - alert: HighFailedAuthenticationRate
        expr: rate(swarm_auth_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High authentication failure rate"
          description: "{{ $value }} authentication failures per second"
          
      - alert: UnauthorizedAPIAccess
        expr: rate(http_requests_total{status="401"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate of unauthorized API access"
          description: "{{ $value }} unauthorized requests per second"
          
      - alert: SuspiciousLangfuseActivity
        expr: rate(langfuse_requests_total{method="DELETE"}[5m]) > 10
        for: 5m
        labels:
          severity: info
          team: security
        annotations:
          summary: "High rate of DELETE operations in Langfuse"
          description: "{{ $value }} DELETE requests per second to Langfuse"

  - name: business_metrics
    interval: 1m
    rules:
      - alert: NoActiveSwarms
        expr: active_swarms_total == 0
        for: 15m
        labels:
          severity: info
          team: business
        annotations:
          summary: "No active swarms"
          description: "No swarms have been active for 15 minutes"
          
      - alert: HighSwarmChurn
        expr: |
          rate(swarm_lifecycle_events_total{event="terminated"}[1h]) 
          / rate(swarm_lifecycle_events_total{event="created"}[1h]) > 0.5
        for: 30m
        labels:
          severity: warning
          team: business
        annotations:
          summary: "High swarm termination rate"
          description: "{{ $value | humanizePercentage }} of created swarms are being terminated"
          
      - alert: APIUsageSpike
        expr: |
          rate(api_requests_total[5m]) 
          > avg_over_time(rate(api_requests_total[5m])[1h:5m]) * 3
        for: 10m
        labels:
          severity: info
          team: business
        annotations:
          summary: "API usage spike detected"
          description: "API requests are 3x higher than hourly average"
          
      - alert: LowLangfuseUsage
        expr: rate(langfuse_traces_total[1h]) < 10
        for: 2h
        labels:
          severity: info
          team: business
        annotations:
          summary: "Low Langfuse usage"
          description: "Less than 10 traces per hour for 2 hours"
          
      - alert: SwarmEfficiencyLow
        expr: |
          swarm_tasks_completed_total 
          / swarm_tasks_started_total < 0.8
        for: 1h
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Low swarm task completion rate"
          description: "Only {{ $value | humanizePercentage }} of tasks are completing successfully"