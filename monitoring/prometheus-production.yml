# Prometheus Production Configuration
# Comprehensive monitoring for Swarm platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production-swarm'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load rules files
rule_files:
  - "alerts-production.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'

  # PostgreSQL monitoring
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    params:
      target: ['postgres-primary:5432', 'postgres-replica:5432']

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    params:
      target: ['redis-master:6379', 'redis-replica:6379']

  # HAProxy monitoring
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']
    metrics_path: '/metrics'

  # Nginx monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Swarm Manager monitoring
  - job_name: 'swarm-manager'
    static_configs:
      - targets: ['swarm-manager:9001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Swarm Workers monitoring
  - job_name: 'swarm-workers'
    static_configs:
      - targets:
          - 'swarm-worker-1:9001'
          - 'swarm-worker-2:9001'
          - 'swarm-worker-3:9001'
    metrics_path: '/metrics'
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: worker_id
        regex: 'swarm-worker-(.+):.*'
        replacement: 'worker-$1'

  # Langfuse monitoring
  - job_name: 'langfuse'
    static_configs:
      - targets:
          - 'langfuse-server-1:3000'
          - 'langfuse-server-2:3000'
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # Dashboard monitoring
  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:3000']
    metrics_path: '/api/metrics'

  # Docker containers monitoring
  - job_name: 'docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

  # Blackbox exporter for endpoint monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'https://yourdomain.com'
          - 'https://yourdomain.com/api/health'
          - 'https://yourdomain.com/langfuse/api/public/health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 50GB

# Remote write for long-term storage (optional)
