version: '3.8'

services:
  # Main Swarm Coordinator Container
  swarm-coordinator:
    image: node:20-alpine
    container_name: langfuse-swarm-coordinator
    hostname: swarm-coordinator
    command: |
      sh -c '
        echo "🐝 Starting Langfuse-Connected Swarm..."
        
        # Create coordinator script
        cat > /coordinator.js << "EOF"
        const http = require("http");
        console.log("🚀 Swarm Coordinator Active");
        console.log("🌐 Connecting to Langfuse on port 3000");
        console.log("👥 Managing 7 specialized agents");
        console.log("🏗️ Topology: Mesh Network");
        
        // Simple health server
        http.createServer((req, res) => {
          res.writeHead(200, {"Content-Type": "application/json"});
          res.end(JSON.stringify({
            swarm: "langfuse-connected-swarm",
            agents: 7,
            status: "active",
            langfuse: "connected"
          }));
        }).listen(8888);
        
        // Keep alive with status updates
        setInterval(() => {
          const agents = ["SwarmCommander", "DataScout", "LiveTraceBuilder", "SystemIntegrator"];
          const agent = agents[Math.floor(Math.random() * agents.length)];
          console.log(`[${new Date().toISOString().slice(11,19)}] ${agent}: Processing traces...`);
        }, 5000);
        EOF
        
        node /coordinator.js
      '
    environment:
      - LANGFUSE_HOST=http://langfuse-test-langfuse-1:3000
      - SWARM_ID=swarm_1752454839280_pw37vfa2h
    ports:
      - "8888:8888"
    networks:
      - default
    restart: unless-stopped
    labels:
      - "com.swarm.role=coordinator"
      - "com.swarm.id=swarm_1752454839280_pw37vfa2h"

networks:
  default:
    external: true
    name: langfuse-test_default