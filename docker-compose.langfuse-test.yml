version: '3.8'

services:
  # Lightweight PostgreSQL for Langfuse
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_test
      POSTGRES_DB: langfuse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - langfuse-test

  # Langfuse Server
  langfuse-server:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_test@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: test_secret_change_in_production
      SALT: test_salt_change_in_production
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: test_encryption_key_change_in_production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langfuse-test

  # Wrapper Test Environment
  langfuse-wrapper-test:
    build:
      context: ./shared/langfuse-wrapper
      dockerfile: ../../Dockerfile.langfuse-test
    depends_on:
      langfuse-server:
        condition: service_healthy
    environment:
      NODE_ENV: test
      LANGFUSE_PUBLIC_KEY: pk-lf-test-key
      LANGFUSE_SECRET_KEY: sk-lf-test-key
      LANGFUSE_HOST: http://langfuse-server:3000
      LANGFUSE_ENABLED: "true"
      # Test configuration
      SWARM_ID: test-swarm-001
      AGENT_ID: test-agent-001
      AGENT_ROLE: tester
      TEST_MODE: "true"
      # Enable all features for testing
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      # Optional: Disable Langfuse for testing fallback behavior
      LANGFUSE_ENABLED_OVERRIDE: "${LANGFUSE_ENABLED_OVERRIDE:-true}"
    volumes:
      - ./shared/langfuse-wrapper:/app:ro
      - test_results:/app/test-results
      - ./.swarm:/app/.swarm
    networks:
      - langfuse-test
    command: >
      sh -c "
        echo '🔧 Building Langfuse wrapper...'
        npm install
        npm run build
        echo '🧪 Running comprehensive tests...'
        npm run test:comprehensive
        echo '📊 Generating test report...'
        node test-runner.js
        echo '✅ Test execution complete!'
      "
    profiles:
      - test

  # Optional: Test with Langfuse disabled (fallback mode)
  wrapper-test-fallback:
    build:
      context: ./shared/langfuse-wrapper
      dockerfile: ../../Dockerfile.langfuse-test
    environment:
      NODE_ENV: test
      LANGFUSE_ENABLED: "false"
      SWARM_ID: test-swarm-fallback
      AGENT_ID: test-agent-fallback
      AGENT_ROLE: tester
      TEST_MODE: "true"
      FALLBACK_MODE: "true"
    volumes:
      - ./shared/langfuse-wrapper:/app:ro
      - test_results:/app/test-results
      - ./.swarm:/app/.swarm
    networks:
      - langfuse-test
    command: >
      sh -c "
        echo '🔧 Building wrapper in fallback mode...'
        npm install
        npm run build
        echo '🧪 Testing graceful degradation...'
        npm run test:unit
        echo '📊 Generating fallback test report...'
        node test-runner.js --fallback
        echo '✅ Fallback test complete!'
      "
    profiles:
      - test-fallback

volumes:
  postgres_data:
    driver: local
  test_results:
    driver: local

networks:
  langfuse-test:
    driver: bridge