version: '3.8'

# Development-specific overrides for docker-compose.claude-flow.yml
# Use with: docker-compose -f docker-compose.claude-flow.yml -f docker-compose.dev.yml up

services:
  # Manager with hot reload
  manager:
    build:
      context: .
      dockerfile: Dockerfile.claude-flow
      target: development
    volumes:
      - ./apps/manager:/workspace/apps/manager
      - ./packages:/workspace/packages
      - ./shared:/workspace/shared
      - /workspace/node_modules
      - /workspace/apps/manager/node_modules
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
    command: cd apps/manager && pnpm run dev

  # Dashboard with hot reload
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.claude-flow
      target: development
    volumes:
      - ./apps/dashboard:/workspace/apps/dashboard
      - ./packages:/workspace/packages
      - ./shared:/workspace/shared
      - /workspace/node_modules
      - /workspace/apps/dashboard/node_modules
      - /workspace/apps/dashboard/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: cd apps/dashboard && pnpm run dev

  # Worker with hot reload
  worker:
    build:
      context: .
      dockerfile: Dockerfile.claude-flow
      target: development
    volumes:
      - ./apps/worker:/workspace/apps/worker
      - ./packages:/workspace/packages
      - ./shared:/workspace/shared
      - /workspace/node_modules
      - /workspace/apps/worker/node_modules
    environment:
      - NODE_ENV=development
      - DEBUG=true
    command: cd apps/worker && pnpm run dev

  # Development database with pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@claude-flow.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - claude-flow-network
    profiles:
      - dev-tools

  # Redis Commander for Redis GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-claude-flow-redis}
    networks:
      - claude-flow-network
    profiles:
      - dev-tools

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - claude-flow-network
    profiles:
      - dev-tools

  # Documentation server
  docs:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    networks:
      - claude-flow-network
    profiles:
      - dev-tools

volumes:
  pgadmin-data:
EOF < /dev/null