version: '3.8'

services:
  # PostgreSQL Database for Langfuse (Production)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-langfuse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./config/postgres/production-tuning.sql:/docker-entrypoint-initdb.d/02-tuning.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - swarm-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Langfuse Server (Production v2)
  langfuse-server:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-https://langfuse.yourdomain.com}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      LANGFUSE_DEFAULT_PROJECT_ID: ${LANGFUSE_DEFAULT_PROJECT_ID}
      LANGFUSE_DEFAULT_PROJECT_SECRET: ${LANGFUSE_DEFAULT_PROJECT_SECRET}
      # Production optimizations
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
      # Security headers
      LANGFUSE_CSP_ENFORCE_HTTPS: "true"
      LANGFUSE_ALLOWED_ORIGINS: ${LANGFUSE_ALLOWED_ORIGINS}
    ports:
      - "${LANGFUSE_PORT:-3050}:3000"
    volumes:
      - langfuse_data:/app/data
      - langfuse_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - swarm-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis for Caching and Coordination (Production)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/production.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarm-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Swarm Manager Service (Production)
  swarm-manager:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: manager
      args:
        - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      langfuse-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: manager-001
      AGENT_ROLE: manager
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      
      # Logging and Monitoring
      LANGFUSE_LOG_LEVEL: ${LOG_LEVEL:-info}
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      LANGFUSE_ENABLE_PROFILING: "true"
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${MANAGER_API_KEY}
      
      # Performance
      MAX_WORKERS: ${MAX_WORKERS:-4}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300}
      
      PORT: 8001
    ports:
      - "${MANAGER_PORT:-8001}:8001"
      - "${MANAGER_METRICS_PORT:-9001}:9001"  # Metrics endpoint
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For container orchestration
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "swarm.role=manager"
      - "swarm.type=coordinator"

  # Swarm Worker Services (Production Scale)
  swarm-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: worker
      args:
        - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-001
      AGENT_ROLE: coder
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # Feature Flags (same as manager)
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      
      # Logging
      LANGFUSE_LOG_LEVEL: ${LOG_LEVEL:-info}
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_1_SPECIALIZATION:-general}
      WORKER_CAPACITY: ${WORKER_1_CAPACITY:-10}
      
      PORT: 8002
    ports:
      - "${WORKER_1_PORT:-8002}:8002"
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "swarm.role=worker"
      - "swarm.type=coder"

  swarm-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: worker
      args:
        - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-002
      AGENT_ROLE: analyst
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      
      # Logging
      LANGFUSE_LOG_LEVEL: ${LOG_LEVEL:-info}
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_2_SPECIALIZATION:-analysis}
      WORKER_CAPACITY: ${WORKER_2_CAPACITY:-8}
      
      PORT: 8003
    ports:
      - "${WORKER_2_PORT:-8003}:8003"
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "swarm.role=worker"
      - "swarm.type=analyst"

  swarm-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.swarm
      target: worker
      args:
        - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      swarm-manager:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      
      # Langfuse Configuration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-production-swarm}
      AGENT_ID: worker-003
      AGENT_ROLE: tester
      MANAGER_URL: http://swarm-manager:8001
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # Feature Flags
      LANGFUSE_COORDINATION_ENABLED: "true"
      LANGFUSE_MEMORY_DB_PATH: /app/data/.swarm/memory.db
      LANGFUSE_FEATURE_AUTO_TRACING: "true"
      LANGFUSE_FEATURE_SPAN_ENRICHMENT: "true"
      LANGFUSE_FEATURE_TOKEN_TRACKING: "true"
      LANGFUSE_FEATURE_MEMORY_COORDINATION: "true"
      LANGFUSE_FEATURE_HOOK_INTERCEPTION: "true"
      LANGFUSE_FEATURE_PERFORMANCE_MONITORING: "true"
      
      # Logging
      LANGFUSE_LOG_LEVEL: ${LOG_LEVEL:-info}
      LANGFUSE_COLLECT_METRICS: "true"
      LANGFUSE_TRACK_TOKEN_COSTS: "true"
      
      # Worker specific
      WORKER_SPECIALIZATION: ${WORKER_3_SPECIALIZATION:-testing}
      WORKER_CAPACITY: ${WORKER_3_CAPACITY:-6}
      
      PORT: 8004
    ports:
      - "${WORKER_3_PORT:-8004}:8004"
    volumes:
      - swarm_data:/app/data
      - swarm_logs:/app/logs
      - ./shared/langfuse-wrapper:/app/langfuse-wrapper:ro
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "swarm.role=worker"
      - "swarm.type=tester"

  # Load Balancer (HAProxy)
  load-balancer:
    image: haproxy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - swarm-manager
      - swarm-worker-1
      - swarm-worker-2
      - swarm-worker-3
    ports:
      - "${LB_PORT:-80}:80"
      - "${LB_STATS_PORT:-8404}:8404"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8404/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "swarm.role=loadbalancer"

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - swarm-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - swarm-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    profiles:
      - monitoring

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - swarm-network
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - swarm_logs:/app/logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - swarm-network
    profiles:
      - monitoring

  # Security Scanner
  trivy:
    image: aquasec/trivy:latest
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy_cache:/root/.cache/trivy
    command: --version
    networks:
      - swarm-network
    profiles:
      - security

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/postgres
  langfuse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/langfuse
  langfuse_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/langfuse-uploads
  swarm_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/swarm
  swarm_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/logs
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  trivy_cache:
    driver: local

networks:
  swarm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: swarm-net
      com.docker.network.driver.mtu: 1500