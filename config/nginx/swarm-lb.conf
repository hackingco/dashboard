# NGINX Load Balancer Configuration for Swarm
# Distributes requests across agent pool and coordinator

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format swarm_format '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream_addr=$upstream_addr '
                           'response_time=$request_time '
                           'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/swarm_access.log swarm_format;
    error_log  /var/log/nginx/swarm_error.log warn;

    # Performance optimizations
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=swarm:10m rate=50r/s;

    # Upstream definitions
    upstream swarm_coordinator {
        least_conn;
        server swarm-coordinator:8090 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream agent_pool_manager {
        least_conn;
        server agent-pool-manager:8092 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Health check upstream (internal)
    upstream health_check {
        server swarm-coordinator:8090;
        server agent-pool-manager:8092 backup;
    }

    # Main server block
    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://health_check/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Coordinator API routes
        location /api/coordinator/ {
            limit_req zone=api burst=20 nodelay;
            
            rewrite ^/api/coordinator/(.*) /api/$1 break;
            proxy_pass http://swarm_coordinator;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Agent Pool Manager routes
        location /api/agents/ {
            limit_req zone=api burst=30 nodelay;
            
            rewrite ^/api/agents/(.*) /api/$1 break;
            proxy_pass http://agent_pool_manager;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket coordination endpoint
        location /ws {
            limit_req zone=swarm burst=100 nodelay;
            
            proxy_pass http://swarm-coordinator:8091;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # Long timeout for persistent connections
        }

        # Swarm task execution (load balanced across available agents)
        location /api/tasks/ {
            limit_req zone=swarm burst=50 nodelay;
            
            # Route to coordinator first for task distribution
            proxy_pass http://swarm_coordinator;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Enable response buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Metrics endpoint (for monitoring)
        location /metrics {
            access_log off;
            allow 172.21.0.0/16;  # Only allow internal network
            deny all;
            
            proxy_pass http://swarm_coordinator/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Status page
        location /status {
            access_log off;
            stub_status on;
            allow 172.21.0.0/16;  # Only allow internal network
            deny all;
        }

        # Default fallback
        location / {
            return 404 '{"error": "Swarm endpoint not found", "available": ["/api/coordinator", "/api/agents", "/api/tasks", "/ws", "/health"]}';
            add_header Content-Type application/json;
        }
    }

    # Additional server for HTTPS (if needed)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-swarm-domain.com;
    #     
    #     ssl_certificate /etc/ssl/certs/swarm.crt;
    #     ssl_certificate_key /etc/ssl/private/swarm.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # Include same location blocks as above
    # }
}