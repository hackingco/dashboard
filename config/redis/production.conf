# Redis Production Configuration
# Optimized for high performance and reliability

# Network Configuration
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Security
requirepass changeme_in_production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command SHUTDOWN SHUTDOWN_SWARM_ONLY

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Replication (for future scaling)
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

# Client Configuration
maxclients 10000

# Lazy Freeing (for better performance)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threaded I/O (Redis 6+)
io-threads 4
io-threads-do-reads yes

# Lua Scripting
lua-time-limit 5000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Event Notification (for monitoring)
notify-keyspace-events "KEA"

# Advanced Configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency
hz 10
dynamic-hz yes

# Background Saving
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Swarm-specific optimizations
# Keyspace patterns for swarm coordination:
# swarm:{swarm_id}:agents -> hash of active agents
# swarm:{swarm_id}:tasks -> list of pending tasks
# swarm:{swarm_id}:memory:{key} -> swarm memory storage
# swarm:{swarm_id}:metrics -> performance metrics
# swarm:{swarm_id}:status -> current swarm status

# Enable keyspace notifications for swarm coordination
# K = keyspace events
# E = keyevent events  
# A = all events

# Performance tuning for swarm workloads
# Higher timeout for long-running swarm operations
timeout 600

# Increased backlog for multiple swarm connections
tcp-backlog 1024

# Optimized for frequent small operations (typical in swarm coordination)
hash-max-ziplist-entries 1024
list-max-ziplist-size -1

# Memory usage tracking
maxmemory-samples 10

# Disable unused features for performance
# cluster-enabled no
# sentinel-mode no