# HAProxy Configuration for Swarm Load Balancing
# Production-ready load balancer for swarm services

global
    # Process management
    daemon
    user haproxy
    group haproxy
    
    # Performance tuning
    maxconn 4096
    nbproc 1
    nbthread 2
    
    # Logging
    log stdout local0 info
    
    # SSL/TLS (if needed)
    # ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    # ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    
    # Stats socket for admin
    stats socket /var/run/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option http-server-close
    
    # Timeouts
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 3s
    
    # Error handling
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Statistics interface
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats admin if TRUE
    
    # Optional basic auth for stats
    # stats auth admin:your_stats_password

# Main frontend for swarm services
frontend swarm_frontend
    bind *:80
    
    # Request routing based on path
    acl is_manager path_beg /api/manager
    acl is_worker path_beg /api/worker
    acl is_langfuse path_beg /langfuse
    acl is_health path_beg /health
    
    # Route to appropriate backend
    use_backend swarm_manager if is_manager
    use_backend swarm_workers if is_worker
    use_backend langfuse_backend if is_langfuse
    use_backend health_backend if is_health
    
    # Default to swarm manager
    default_backend swarm_manager
    
    # Security headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Backend for swarm manager
backend swarm_manager
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    # Manager server
    server manager1 swarm-manager:8001 check inter 10s fall 3 rise 2
    
    # Request/response modifications
    http-request set-header X-Forwarded-Proto http
    http-request add-header X-Forwarded-For %[src]
    
    # Timeout for long-running operations
    timeout server 300s

# Backend for swarm workers (load balanced)
backend swarm_workers
    balance leastconn
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    # Worker servers
    server worker1 swarm-worker-1:8002 check inter 15s fall 3 rise 2 weight 100
    server worker2 swarm-worker-2:8003 check inter 15s fall 3 rise 2 weight 100
    server worker3 swarm-worker-3:8004 check inter 15s fall 3 rise 2 weight 100
    
    # Sticky sessions if needed (comment out for stateless)
    # cookie SERVERID insert indirect nocache
    
    # Request modifications
    http-request set-header X-Forwarded-Proto http
    http-request add-header X-Forwarded-For %[src]
    
    # Load balancing options
    option prefer-last-server  # Prefer already established connections
    
    # Timeout for worker operations
    timeout server 600s  # Longer timeout for complex tasks

# Backend for Langfuse
backend langfuse_backend
    balance roundrobin
    option httpchk GET /api/public/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    server langfuse1 langfuse-server:3000 check inter 30s fall 3 rise 2
    
    # URL rewriting (remove /langfuse prefix)
    http-request replace-path ^/langfuse(.*) \1
    
    # Langfuse specific headers
    http-request set-header X-Forwarded-Proto http
    http-request add-header X-Forwarded-For %[src]

# Health check backend (simple health aggregation)
backend health_backend
    mode http
    balance roundrobin
    
    # Health check all services
    server manager_health swarm-manager:8001 check inter 5s
    server worker1_health swarm-worker-1:8002 check inter 5s
    server worker2_health swarm-worker-2:8003 check inter 5s
    server worker3_health swarm-worker-3:8004 check inter 5s
    server langfuse_health langfuse-server:3000 check inter 10s
    
    # Custom health response
    http-request return status 200 content-type "application/json" string '{"status":"healthy","timestamp":"${date}","load_balancer":"active"}' if { nbsrv(health_backend) ge 3 }
    http-request return status 503 content-type "application/json" string '{"status":"degraded","timestamp":"${date}","healthy_servers":${nbsrv(health_backend)}}' if { nbsrv(health_backend) ge 1 }
    http-request return status 503 content-type "application/json" string '{"status":"unhealthy","timestamp":"${date}","healthy_servers":0}'

