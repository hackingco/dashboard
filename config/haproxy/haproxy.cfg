global
    maxconn 4096
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

# HAProxy Statistics
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Main HTTP Frontend
frontend http_frontend
    bind *:80
    mode http
    
    # ACLs for routing
    acl is_api path_beg /api
    acl is_langfuse path_beg /langfuse
    acl is_grafana path_beg /grafana
    acl is_dashboard path_beg /
    
    # Route to appropriate backend
    use_backend api_backend if is_api
    use_backend langfuse_backend if is_langfuse
    use_backend grafana_backend if is_grafana
    default_backend dashboard_backend

# Manager API Backend
backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server manager-1 manager-1:8080 check inter 30s rise 2 fall 3
    server manager-2 manager-2:8080 check inter 30s rise 2 fall 3
    server manager-3 manager-3:8080 check inter 30s rise 2 fall 3

# Dashboard Backend
backend dashboard_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    
    server dashboard-1 dashboard:3000 check inter 30s rise 2 fall 3

# Langfuse Backend
backend langfuse_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    
    server langfuse-1 langfuse:3000 check inter 30s rise 2 fall 3

# Grafana Backend
backend grafana_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    
    server grafana-1 grafana:3000 check inter 30s rise 2 fall 3