# HAProxy Production Configuration
# High Availability Load Balancer for Swarm Platform

global
    log         127.0.0.1 local0
    log         127.0.0.1 local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     10000
    user        haproxy
    group       haproxy
    daemon

    # Performance tuning
    nbproc      1
    nbthread    4
    cpu-map     auto:1/1-4 0-3
    
    # SSL/TLS configuration
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!PSK:!DHE:!RSA:!DSS:!aNull:!MD5
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    ssl-default-server-ciphers ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!PSK:!DHE:!RSA:!DSS:!aNull:!MD5
    ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
    
    # Enable stats socket for runtime API
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

    # Tune buffers for better performance
    tune.bufsize 32768
    tune.ssl.default-dh-param 2048

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      log-health-checks
    option      redispatch
    option      forwardfor
    option      http-server-close
    
    # Timeouts
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout http-request    15s
    timeout http-keep-alive 15s
    timeout check           10s
    timeout queue           30s
    
    # Error handling
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Statistics and monitoring
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-node
    stats show-legends
    stats admin if TRUE

# Frontend - HTTPS termination
frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/swarm.pem alpn h2,http/1.1
    bind *:80
    
    # Redirect HTTP to HTTPS
    http-request redirect scheme https if !{ ssl_fc }
    
    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }
    
    # ACLs for routing
    acl is_langfuse path_beg /langfuse
    acl is_api path_beg /api
    acl is_dashboard path_beg /dashboard
    acl is_grafana path_beg /grafana
    acl is_prometheus path_beg /prometheus
    acl is_websocket hdr(Upgrade) -i websocket
    
    # Route to appropriate backend
    use_backend langfuse_backend if is_langfuse
    use_backend api_backend if is_api
    use_backend dashboard_backend if is_dashboard
    use_backend grafana_backend if is_grafana
    use_backend prometheus_backend if is_prometheus
    use_backend websocket_backend if is_websocket
    
    # Default backend
    default_backend dashboard_backend

# Backend - Langfuse cluster
backend langfuse_backend
    balance roundrobin
    option httpchk GET /api/public/health
    http-check expect status 200
    
    # Sticky sessions for Langfuse
    cookie LANGFUSE_SESSION insert indirect nocache httponly secure
    
    # Strip path prefix
    http-request set-path %[path,regsub(^/langfuse,)]
    
    # Connection pooling
    http-reuse safe
    
    # Servers with health checks
    server langfuse1 langfuse-server-1:3000 check inter 5s rise 2 fall 3 maxconn 50 cookie langfuse1
    server langfuse2 langfuse-server-2:3000 check inter 5s rise 2 fall 3 maxconn 50 cookie langfuse2

# Backend - API (Swarm Manager)
backend api_backend
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    
    # Strip path prefix
    http-request set-path %[path,regsub(^/api,)]
    
    # Add request ID for tracing
    http-request set-header X-Request-ID %[uuid()]
    
    # Circuit breaker
    option redispatch
    retries 3
    
    # Connection pooling
    http-reuse safe
    
    # Manager server
    server manager swarm-manager:8001 check inter 3s rise 2 fall 3 maxconn 100

# Backend - Dashboard
backend dashboard_backend
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    
    # Sticky sessions for dashboard
    cookie DASHBOARD_SESSION insert indirect nocache httponly secure
    
    # Strip path prefix if present
    http-request set-path %[path,regsub(^/dashboard,)]
    
    # Connection pooling
    http-reuse safe
    
    # Dashboard servers
    server dashboard1 dashboard:3000 check inter 5s rise 2 fall 3 maxconn 30 cookie dash1
    server dashboard2 dashboard:3001 check inter 5s rise 2 fall 3 maxconn 30 cookie dash2 backup

# Backend - Grafana
backend grafana_backend
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    
    # Keep Grafana sessions sticky
    cookie GRAFANA_SESSION insert indirect nocache httponly secure
    
    # Connection settings
    http-reuse safe
    
    server grafana grafana:3000 check inter 5s rise 2 fall 3 maxconn 20 cookie grafana1

# Backend - Prometheus
backend prometheus_backend
    balance roundrobin
    option httpchk GET /-/healthy
    http-check expect status 200
    
    # Connection settings
    http-reuse safe
    
    server prometheus prometheus:9090 check inter 5s rise 2 fall 3 maxconn 20

# Backend - WebSocket connections
backend websocket_backend
    balance source
    option http-server-close
    option forceclose
    
    # WebSocket specific timeouts
    timeout server 3600s
    timeout client 3600s
    timeout connect 5s
    
    # Route based on path
    use-server swarm-ws if { path_beg /swarm-ws }
    use-server langfuse-ws if { path_beg /langfuse-ws }
    
    server swarm-ws swarm-manager:8001 check inter 5s rise 2 fall 3
    server langfuse-ws langfuse-server-1:3000 check inter 5s rise 2 fall 3

# Backend - Swarm Workers (Internal API)
backend workers_backend
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    
    # Worker pool with auto-discovery
    server-template worker- 10 _worker._tcp.swarm-network check inter 5s rise 2 fall 3 maxconn 20 resolvers docker

# DNS resolver for service discovery
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s
    hold nx 3s
    hold timeout 3s
    hold refused 3s

# Cache for static assets
cache static_cache
    total-max-size 100   # MB
    max-object-size 10   # MB
    max-age 3600         # seconds

# Enable cache for static content
http-request cache-use static_cache if { path_end .js .css .png .jpg .jpeg .gif .ico .woff .woff2 }
http-response cache-store static_cache if { path_end .js .css .png .jpg .jpeg .gif .ico .woff .woff2 }