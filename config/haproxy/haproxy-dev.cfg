# HAProxy Development Configuration
# Simplified configuration for development environment

global
    daemon
    maxconn 1024
    log stdout local0 debug
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

# Statistics interface (more permissive for development)
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

# Main frontend (simplified routing)
frontend dev_frontend
    bind *:80
    
    # Simple path-based routing
    acl is_manager path_beg /api/manager
    acl is_worker path_beg /api/worker
    acl is_langfuse path_beg /langfuse
    acl is_health path_beg /health
    
    use_backend dev_manager if is_manager
    use_backend dev_workers if is_worker
    use_backend dev_langfuse if is_langfuse
    use_backend dev_health if is_health
    
    default_backend dev_manager

# Simplified manager backend
backend dev_manager
    balance roundrobin
    option httpchk GET /health
    server manager1 swarm-manager:8001 check inter 5s
    
    # Development headers
    http-request add-header X-Dev-Environment "true"
    http-request add-header X-Forwarded-For %[src]

# Simplified workers backend (only 2 workers in dev)
backend dev_workers
    balance roundrobin
    option httpchk GET /health
    
    server worker1 swarm-worker-1:8002 check inter 5s
    server worker2 swarm-worker-2:8003 check inter 5s
    
    http-request add-header X-Dev-Environment "true"
    http-request add-header X-Forwarded-For %[src]

# Langfuse backend
backend dev_langfuse
    balance roundrobin
    option httpchk GET /api/public/health
    server langfuse1 langfuse-server:3000 check inter 10s
    
    # Remove /langfuse prefix
    http-request replace-path ^/langfuse(.*) \1
    http-request add-header X-Dev-Environment "true"

# Simple health backend
backend dev_health
    mode http
    server manager swarm-manager:8001 check
    server worker1 swarm-worker-1:8002 check
    server worker2 swarm-worker-2:8003 check
    server langfuse langfuse-server:3000 check
    
    # Return simple health status
    http-request return status 200 content-type "application/json" string '{"status":"dev_healthy","services":${nbsrv(dev_health)}}' if { nbsrv(dev_health) ge 2 }
    http-request return status 503 content-type "application/json" string '{"status":"dev_degraded","services":${nbsrv(dev_health)}}' if { nbsrv(dev_health) ge 1 }
    http-request return status 503 content-type "application/json" string '{"status":"dev_unhealthy","services":0}'