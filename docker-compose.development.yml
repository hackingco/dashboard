version: '3.8'

services:
  # Redis for development
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Manager API Service - Development with hot reload
  manager:
    build:
      context: ./apps/manager
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "9229:9229"  # Node.js debugging
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/swarm_dev}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - FLY_API_TOKEN=${FLY_API_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - DASHBOARD_URL=http://dashboard:3000
      - NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3000
      - DEBUG=swarm:*
    volumes:
      - ./apps/manager:/app
      - ./shared:/shared
      - /app/node_modules
    networks:
      - swarm-network
    depends_on:
      redis:
        condition: service_healthy
    command: npm run dev

  # Next.js Dashboard - Development with hot reload
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/dashboard:/app
      - ./shared:/shared
      - /app/node_modules
      - /app/.next
    networks:
      - swarm-network
    depends_on:
      redis:
        condition: service_healthy
    command: npm run dev

  # PostgreSQL for local development
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=swarm_dev
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - swarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Development tools container
  devtools:
    image: node:18-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
    networks:
      - swarm-network
    command: tail -f /dev/null
    profiles:
      - tools

  # Langfuse local instance for development (optional)
  langfuse-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - swarm-network
    profiles:
      - langfuse-local

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=your-secret-here
      - NEXTAUTH_URL=http://localhost:3001
      - SALT=your-salt-here
    depends_on:
      - langfuse-db
    networks:
      - swarm-network
    profiles:
      - langfuse-local

networks:
  swarm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  redis-dev-data:
    driver: local
  postgres-dev-data:
    driver: local
  langfuse-db-data:
    driver: local