# fly.toml for worker-app (template for dynamic workers)
app = "swarm-worker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  WORKER_TYPE = "generic"
  MANAGER_URL = "http://manager-app.internal:8080"
  TELEMETRY_ENDPOINT = "http://manager-app.internal:8080/telemetry"
  REDIS_URL = "redis://default:password@redis.internal:6379"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 3000
    handlers = ["http"]

[[services.tcp_checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"

[[services.http_checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "get"
  path = "/health"
  protocol = "http"

[mounts]
  source = "worker_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[experimental]
  auto_rollback = true
  private_network = true

[metrics]
  port = 9092
  path = "/metrics"

# Scaling configuration for dynamic workers
[processes]
  app = "node dist/index.js"

# Auto-scaling rules
[[autoscaling]]
  min_machines = 0
  max_machines = 10
  
  [[autoscaling.metrics]]
    type = "requests"
    soft_limit = 20
    hard_limit = 30