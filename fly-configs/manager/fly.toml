# fly.toml for manager-app
app = "swarm-manager"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  SUPABASE_URL = "placeholder"
  LANGFUSE_PUBLIC_KEY = "placeholder"
  LANGFUSE_SECRET_KEY = "placeholder"
  LANGFUSE_BASEURL = "https://us.cloud.langfuse.com"
  FLY_API_TOKEN = "placeholder"
  REDIS_URL = "redis://default:password@redis.internal:6379"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  restart_limit = 0

[[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/health"
  protocol = "http"
  tls_skip_verify = false

[mounts]
  source = "manager_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

[experimental]
  auto_rollback = true
  enable_consul = true

[metrics]
  port = 9090
  path = "/metrics"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/static/"