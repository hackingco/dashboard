# Hive Mind Secrets Configuration
# This file defines all secrets needed for the deployment
# DO NOT commit actual values to git - use environment variables or Fly secrets

manager:
  required:
    - name: SUPABASE_URL
      description: "Supabase project URL"
      example: "https://xxxxx.supabase.co"
    - name: SUPABASE_SERVICE_KEY
      description: "Supabase service role key (full access)"
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    - name: FLY_API_TOKEN
      description: "Fly.io API token for managing machines"
      example: "fo1_..."
  optional:
    - name: LANGFUSE_PUBLIC_KEY
      description: "Langfuse public key for telemetry"
      example: "pk-lf-..."
    - name: LANGFUSE_SECRET_KEY
      description: "Langfuse secret key for telemetry"
      example: "sk-lf-..."
    - name: REDIS_PASSWORD
      description: "Redis password for caching"
      example: "strong-password-here"
    - name: SENTRY_DSN
      description: "Sentry DSN for error tracking"
      example: "https://xxx@xxx.ingest.sentry.io/xxx"

dashboard:
  required:
    - name: NEXT_PUBLIC_SUPABASE_URL
      description: "Supabase project URL (public)"
      example: "https://xxxxx.supabase.co"
    - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
      description: "Supabase anonymous key (public)"
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  optional:
    - name: NEXT_PUBLIC_LANGFUSE_URL
      description: "Langfuse URL for client-side telemetry"
      example: "https://us.cloud.langfuse.com"
    - name: NEXT_PUBLIC_POSTHOG_KEY
      description: "PostHog key for analytics"
      example: "phc_..."

worker:
  required:
    - name: WORKER_TYPE
      description: "Type of worker (set per deployment)"
      example: "data-processor"
    - name: MANAGER_URL
      description: "Internal URL of manager service"
      example: "http://manager-app.internal:8080"
  optional:
    - name: MANAGER_TOKEN
      description: "Authentication token for manager API"
      example: "generated-token"
    - name: REDIS_URL
      description: "Redis URL for worker caching"
      example: "redis://default:password@redis.internal:6379"

shared:
  optional:
    - name: LOG_LEVEL
      description: "Logging level (debug, info, warn, error)"
      example: "info"
    - name: NODE_ENV
      description: "Node environment"
      example: "production"
    - name: TZ
      description: "Timezone"
      example: "UTC"