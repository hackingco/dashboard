name: Manager CI

on:
  push:
    branches: [ dashboard, develop ]
    paths:
      - 'apps/manager/**'
      - '.github/workflows/manager-ci.yml'
  pull_request:
    branches: [ dashboard ]
    paths:
      - 'apps/manager/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Type check
      run: pnpm --filter @swarm/manager run typecheck || true
      
    - name: Build
      run: pnpm --filter @swarm/manager run build
      
    - name: Test
      run: pnpm --filter @swarm/manager run test || true
      env:
        NODE_ENV: test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dashboard'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Fly
      uses: superfly/flyctl-actions/setup-flyctl@master
      
    - name: Deploy to Fly
      run: |
        cd apps/manager
        flyctl deploy --remote-only
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}