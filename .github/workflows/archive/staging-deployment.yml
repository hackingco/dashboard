name: 🚧 Staging Deployment & Testing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options: ['staging', 'preview']
        default: 'staging'

env:
  NODE_VERSION: '18'
  STAGING_ID: ${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}

jobs:
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      manager_changed: ${{ steps.changes.outputs.manager }}
      dashboard_changed: ${{ steps.changes.outputs.dashboard }}
      worker_changed: ${{ steps.changes.outputs.worker }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Detect Changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          base: ${{ github.event.pull_request.base.sha || 'main' }}
          filters: |
            manager:
              - 'apps/manager/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            dashboard:
              - 'admin-dashboard/**'
              - 'shared/types/**'
            worker:
              - 'apps/worker/**'
              - 'shared/**'
            should_deploy:
              - 'apps/**'
              - 'shared/**'
              - '.github/workflows/**'

  validate:
    name: 🔍 Validation & Testing
    needs: detect-changes
    if: needs.detect-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: 📦 Install pnpm
        run: npm install -g pnpm
      
      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 🔍 Lint & Type Check
        run: |
          echo "🔍 Running linting and type checks..."
          pnpm run lint --workspace=apps/manager || echo "Manager linting issues found"
          pnpm run lint --workspace=admin-dashboard || echo "Dashboard linting issues found"
          
          # Type checking
          pnpm run build --workspace=shared/types
      
      - name: 🧪 Unit Tests
        run: |
          echo "🧪 Running unit tests..."
          pnpm run test --workspace=apps/manager || echo "Manager tests failed"
          # Add dashboard tests when available
      
      - name: 🔐 Security Scan
        run: |
          echo "🔐 Running security scans..."
          pnpm audit --audit-level moderate || echo "Security vulnerabilities found"
          npx retire --exitwith 0 || echo "Deprecated dependencies found"
      
      - name: 🏗️ Build All Packages
        run: |
          echo "🏗️ Building all packages..."
          pnpm run build --workspace=shared/types
          pnpm run build --workspace=apps/manager
          pnpm run build --workspace=admin-dashboard

  deploy-staging-manager:
    name: 🖥️ Deploy Manager to Staging
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.manager_changed == 'true'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      staging_url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: 🏗️ Deploy Manager to Staging
        id: deploy
        working-directory: apps/manager
        run: |
          echo "🚀 Deploying Manager to staging..."
          
          # Create or update staging app
          STAGING_APP="swarm-manager-staging-pr-${{ github.event.pull_request.number || 'manual' }}"
          
          # Check if staging app exists, create if not
          if ! flyctl status --app $STAGING_APP 2>/dev/null; then
            echo "Creating new staging app: $STAGING_APP"
            flyctl apps create $STAGING_APP --generate-name=false --org personal
            
            # Copy secrets from production
            flyctl secrets list --app swarm-manager-live --json | \
              jq -r '.[] | "\(.Name)=\(.Value // "")"' | \
              flyctl secrets set --app $STAGING_APP || echo "Failed to copy secrets"
          fi
          
          # Deploy to staging
          flyctl deploy --app $STAGING_APP --build-arg NODE_ENV=staging
          
          # Output staging URL
          STAGING_URL="https://${STAGING_APP}.fly.dev"
          echo "url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "📍 Staging URL: $STAGING_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🩺 Staging Health Check
        run: |
          echo "🩺 Checking staging deployment health..."
          max_attempts=20
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts"
            if curl -f --max-time 10 ${{ steps.deploy.outputs.url }}/health; then
              echo "✅ Staging deployment healthy!"
              break
            else
              echo "❌ Health check failed (attempt $attempt/$max_attempts)"
              if [ $attempt -eq $max_attempts ]; then
                echo "💥 Staging deployment failed health check"
                exit 1
              fi
              sleep 15
              attempt=$((attempt + 1))
            fi
          done

  deploy-staging-dashboard:
    name: 🎨 Deploy Dashboard to Preview
    needs: [detect-changes, validate, deploy-staging-manager]
    if: always() && needs.detect-changes.outputs.dashboard_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: 📦 Install pnpm
        run: npm install -g pnpm
      
      - name: 📥 Install Dependencies
        working-directory: admin-dashboard
        run: pnpm install --frozen-lockfile
      
      - name: 🏗️ Build Dashboard for Preview
        id: deploy
        working-directory: admin-dashboard
        run: |
          echo "🏗️ Building dashboard for preview..."
          
          # Use staging API URL if manager was deployed
          if [ "${{ needs.deploy-staging-manager.outputs.staging_url }}" != "" ]; then
            MANAGER_URL="${{ needs.deploy-staging-manager.outputs.staging_url }}"
            WS_URL="${{ needs.deploy-staging-manager.outputs.staging_url }}"
            WS_URL="${WS_URL/https:/wss:}"
          else
            MANAGER_URL="https://swarm-manager-live.fly.dev"
            WS_URL="wss://swarm-manager-live.fly.dev"
          fi
          
          echo "Using Manager URL: $MANAGER_URL"
          echo "Using WebSocket URL: $WS_URL"
          
          # Build with staging/preview environment
          VITE_MANAGER_URL="$MANAGER_URL" \
          VITE_WS_URL="$WS_URL" \
          VITE_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          VITE_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
          pnpm run build
      
      - name: 🚀 Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: admin-dashboard
          github-comment: true
          scope: ${{ secrets.VERCEL_ORG_ID }}

  e2e-testing:
    name: 🎭 End-to-End Testing
    needs: [deploy-staging-manager, deploy-staging-dashboard]
    if: always() && (needs.deploy-staging-manager.result == 'success' || needs.deploy-staging-dashboard.result == 'success')
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: 📦 Install pnpm
        run: npm install -g pnpm
      
      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 🎭 Run E2E Tests
        run: |
          echo "🎭 Running end-to-end tests against staging..."
          
          # Set test URLs
          if [ "${{ needs.deploy-staging-manager.outputs.staging_url }}" != "" ]; then
            export TEST_API_URL="${{ needs.deploy-staging-manager.outputs.staging_url }}"
          else
            export TEST_API_URL="https://swarm-manager-live.fly.dev"
          fi
          
          if [ "${{ needs.deploy-staging-dashboard.outputs.preview_url }}" != "" ]; then
            export TEST_DASHBOARD_URL="${{ needs.deploy-staging-dashboard.outputs.preview_url }}"
          else
            export TEST_DASHBOARD_URL="https://admin-dashboard-l0e1w6ivz-hackingco.vercel.app"
          fi
          
          echo "Testing API: $TEST_API_URL"
          echo "Testing Dashboard: $TEST_DASHBOARD_URL"
          
          # Basic API tests
          echo "🧪 Testing API endpoints..."
          curl -f --max-time 10 "$TEST_API_URL/health" || echo "API health test failed"
          
          # Basic dashboard tests
          echo "🧪 Testing dashboard..."
          curl -f --max-time 10 "$TEST_DASHBOARD_URL" || echo "Dashboard test failed"
          
          # Run actual E2E tests if they exist
          # pnpm run test:e2e || echo "No E2E tests found"
          
          echo "✅ E2E testing completed"

  performance-testing:
    name: 📊 Performance Testing
    needs: [deploy-staging-manager]
    if: needs.deploy-staging-manager.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 📊 Load Testing
        run: |
          echo "📊 Running performance tests..."
          
          STAGING_URL="${{ needs.deploy-staging-manager.outputs.staging_url }}"
          
          # Basic response time test
          echo "Testing response times..."
          for i in {1..5}; do
            start_time=$(date +%s%N)
            curl -f --max-time 5 "$STAGING_URL/health" > /dev/null 2>&1 || echo "Request $i failed"
            end_time=$(date +%s%N)
            response_time=$(( (end_time - start_time) / 1000000 ))
            echo "Request $i: ${response_time}ms"
          done
          
          # Simple load test (if available)
          echo "🚀 Basic load test completed"

  security-testing:
    name: 🔒 Security Testing
    needs: [deploy-staging-manager]
    if: needs.deploy-staging-manager.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
      
      - name: 🔒 Security Scan
        run: |
          echo "🔒 Running security tests on staging..."
          
          STAGING_URL="${{ needs.deploy-staging-manager.outputs.staging_url }}"
          
          # Basic security headers check
          echo "Checking security headers..."
          curl -I "$STAGING_URL/health" | grep -i "security\|cors\|content-type" || echo "No security headers found"
          
          # Check for exposed sensitive endpoints
          echo "Checking for exposed endpoints..."
          curl -f "$STAGING_URL/.env" && echo "⚠️ .env file exposed!" || echo "✅ .env file not exposed"
          curl -f "$STAGING_URL/config" && echo "⚠️ Config endpoint exposed!" || echo "✅ Config endpoint not exposed"
          
          echo "✅ Basic security scan completed"

  cleanup-staging:
    name: 🧹 Cleanup Staging Resources
    needs: [deploy-staging-manager, e2e-testing, performance-testing, security-testing]
    if: always() && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: 🛠️ Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: 🧹 Cleanup Staging App
        run: |
          echo "🧹 Cleaning up staging resources..."
          
          STAGING_APP="swarm-manager-staging-pr-${{ github.event.pull_request.number }}"
          
          # Delete staging app if it exists
          if flyctl status --app $STAGING_APP 2>/dev/null; then
            echo "Deleting staging app: $STAGING_APP"
            flyctl apps destroy $STAGING_APP --yes
          else
            echo "Staging app $STAGING_APP not found (already cleaned up)"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  report-results:
    name: 📋 Generate Test Report
    needs: [detect-changes, validate, deploy-staging-manager, deploy-staging-dashboard, e2e-testing, performance-testing, security-testing]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Generate Comprehensive Report
        run: |
          echo "## 🚧 Staging Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Changes detected
          echo "### 🔍 Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.manager_changed }}" == "true" ]; then
            echo "| Manager API | ✅ Yes | ${{ needs.deploy-staging-manager.result || 'Not deployed' }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Manager API | ⏭️ No | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.dashboard_changed }}" == "true" ]; then
            echo "| Dashboard | ✅ Yes | ${{ needs.deploy-staging-dashboard.result || 'Not deployed' }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dashboard | ⏭️ No | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.worker_changed }}" == "true" ]; then
            echo "| Worker Service | ✅ Yes | Not implemented in staging |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Worker Service | ⏭️ No | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Testing results
          echo "### 🧪 Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result || 'Skipped' }} | Linting, type checking, unit tests |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Testing | ${{ needs.e2e-testing.result || 'Skipped' }} | End-to-end functionality |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-testing.result || 'Skipped' }} | Load and response time testing |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-testing.result || 'Skipped' }} | Security scan and vulnerability check |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Deployment URLs
          echo "### 🔗 Staging URLs" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-staging-manager.outputs.staging_url }}" != "" ]; then
            echo "- **Manager API**: ${{ needs.deploy-staging-manager.outputs.staging_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-staging-dashboard.outputs.preview_url }}" != "" ]; then
            echo "- **Dashboard**: ${{ needs.deploy-staging-dashboard.outputs.preview_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging ID**: ${{ env.STAGING_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: #${{ github.event.pull_request.number || 'Manual' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.head_ref || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tested at**: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: 📝 PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const staging_url = '${{ needs.deploy-staging-manager.outputs.staging_url }}';
            const preview_url = '${{ needs.deploy-staging-dashboard.outputs.preview_url }}';
            
            let comment = '## 🚧 Staging Deployment Complete\n\n';
            
            if (staging_url) {
              comment += `### 🖥️ Manager API\n`;
              comment += `- **URL**: ${staging_url}\n`;
              comment += `- **Health**: ${staging_url}/health\n\n`;
            }
            
            if (preview_url) {
              comment += `### 🎨 Dashboard\n`;
              comment += `- **URL**: ${preview_url}\n\n`;
            }
            
            comment += '### 🧪 Test Results\n';
            comment += `- **Validation**: ${{ needs.validate.result || 'Skipped' }}\n`;
            comment += `- **E2E Tests**: ${{ needs.e2e-testing.result || 'Skipped' }}\n`;
            comment += `- **Performance**: ${{ needs.performance-testing.result || 'Skipped' }}\n`;
            comment += `- **Security**: ${{ needs.security-testing.result || 'Skipped' }}\n\n`;
            
            comment += '### ✅ Ready for Review\n';
            comment += 'This PR has been automatically tested and deployed to staging. Please review the changes and test the functionality before merging.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });