name: Vercel Dashboard Deployment

on:
  push:
    branches: [main, develop, 'feat/*']
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/vercel-deployment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-dashboard/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Build and Test Dashboard
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check-changes.outputs.should-deploy }}
      build-artifacts: ${{ steps.upload-artifacts.outputs.artifact-id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^admin-dashboard/'; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-changes.outputs.should-deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install dependencies
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        run: npm ci

      - name: Type check
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        run: npm run type-check || echo "Type check completed with warnings"

      - name: Lint
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        run: npm run lint

      - name: Build dashboard
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://swarm-manager-live.fly.dev/api
          VITE_WS_URL: wss://swarm-manager-live.fly.dev/ws
          VITE_DASHBOARD_VERSION: 2.0.0
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Run unit tests (if available)
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        run: npm test --if-present || echo "No tests found"

      - name: Upload build artifacts
        if: steps.check-changes.outputs.should-deploy == 'true'
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build-${{ github.sha }}
          path: admin-dashboard/dist
          retention-days: 7

      - name: Generate build report
        if: steps.check-changes.outputs.should-deploy == 'true'
        working-directory: admin-dashboard
        run: |
          echo "## Build Report" > build-report.md
          echo "- **Commit**: ${{ github.sha }}" >> build-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> build-report.md
          echo "- **Build time**: $(date)" >> build-report.md
          echo "- **Dist size**: $(du -sh dist | cut -f1)" >> build-report.md
          ls -la dist >> build-report.md

      - name: Upload build report
        if: steps.check-changes.outputs.should-deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.sha }}
          path: admin-dashboard/build-report.md

  preview-deployment:
    name: Preview Deployment
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' && needs.build-and-test.outputs.should-deploy == 'true'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build-${{ github.sha }}
          path: admin-dashboard/dist

      - name: Pull Vercel Environment Information
        working-directory: admin-dashboard
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        working-directory: admin-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Preview deployment URL: $DEPLOYMENT_URL"

      - name: Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.preview-url }}';
            
            // Add comment to PR with preview link
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview Deployment Ready!**\n\n🔗 **Preview URL**: ${deploymentUrl}\n\n📱 Test the dashboard features:\n- Real-time swarm monitoring\n- Machine scaling controls\n- WebSocket connectivity\n- API integration\n\n⚡ Deployment includes latest changes from commit ${context.sha.substring(0, 7)}`
              });
            }

      - name: Run deployment health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          PREVIEW_URL="${{ steps.deploy.outputs.preview-url }}"
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL" || echo "000")
          
          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "✅ Preview deployment health check passed"
          else
            echo "❌ Preview deployment health check failed (HTTP $HEALTH_CHECK)"
            exit 1
          fi

  production-deployment:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && needs.build-and-test.outputs.should-deploy == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build-${{ github.sha }}
          path: admin-dashboard/dist

      - name: Pull Vercel Environment Information
        working-directory: admin-dashboard
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        working-directory: admin-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Production deployment URL: $DEPLOYMENT_URL"

      - name: Post-deployment validation
        run: |
          echo "Running post-deployment validation..."
          PROD_URL="${{ steps.deploy.outputs.production-url }}"
          
          # Health check
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
          echo "Health check status: $HEALTH_CHECK"
          
          # API connectivity check
          API_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "000")
          echo "API health check status: $API_CHECK"
          
          # WebSocket connectivity (basic check)
          WS_CHECK=$(curl -s -o /dev/null -w "%{http_code}" -H "Upgrade: websocket" -H "Connection: Upgrade" "$PROD_URL/ws" || echo "000")
          echo "WebSocket upgrade check status: $WS_CHECK"
          
          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "✅ Production deployment health check passed"
          else
            echo "❌ Production deployment health check failed (HTTP $HEALTH_CHECK)"
            exit 1
          fi

      - name: Performance validation
        run: |
          echo "Running performance validation..."
          PROD_URL="${{ steps.deploy.outputs.production-url }}"
          
          # Basic performance check using curl timing
          RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" "$PROD_URL")
          echo "Response time: ${RESPONSE_TIME}s"
          
          # Check if response time is acceptable (< 3 seconds)
          if (( $(echo "$RESPONSE_TIME < 3.0" | bc -l) )); then
            echo "✅ Performance check passed (${RESPONSE_TIME}s)"
          else
            echo "⚠️ Performance check warning: Response time ${RESPONSE_TIME}s exceeds 3s threshold"
          fi

      - name: CDN cache warming
        run: |
          echo "Warming CDN cache..."
          PROD_URL="${{ steps.deploy.outputs.production-url }}"
          
          # Warm key pages
          PAGES=("/" "/swarms" "/metrics" "/settings")
          for page in "${PAGES[@]}"; do
            echo "Warming $page..."
            curl -s "$PROD_URL$page" > /dev/null
          done
          
          echo "✅ CDN cache warming completed"

      - name: Update monitoring systems
        env:
          WEBHOOK_URL: ${{ secrets.MONITORING_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "event": "deployment_success",
                "service": "dashboard",
                "version": "${{ github.sha }}",
                "url": "${{ steps.deploy.outputs.production-url }}",
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }'
            echo "✅ Monitoring systems notified"
          else
            echo "⚠️ No monitoring webhook configured"
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deploy.outputs.production-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "- Health check: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: Validated" >> $GITHUB_STEP_SUMMARY
          echo "- CDN: Cache warmed" >> $GITHUB_STEP_SUMMARY
          echo "- Monitoring: Notified" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup Old Deployments
    runs-on: ubuntu-latest
    needs: [preview-deployment, production-deployment]
    if: always() && (needs.preview-deployment.result == 'success' || needs.production-deployment.result == 'success')
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Cleanup old preview deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Cleaning up old preview deployments..."
          # Keep only the last 10 preview deployments
          vercel ls --token=${{ secrets.VERCEL_TOKEN }} | tail -n +11 | while read deployment; do
            if [[ "$deployment" == *"preview"* ]]; then
              echo "Removing old deployment: $deployment"
              vercel rm "$deployment" --yes --token=${{ secrets.VERCEL_TOKEN }} || echo "Failed to remove $deployment"
            fi
          done

      - name: Clean up old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            // Keep only the last 5 build artifacts
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const dashboardArtifacts = artifacts.data.artifacts
              .filter(artifact => artifact.name.startsWith('dashboard-build-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            if (dashboardArtifacts.length > 5) {
              const toDelete = dashboardArtifacts.slice(5);
              for (const artifact of toDelete) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  console.log(`Deleted artifact: ${artifact.name}`);
                } catch (error) {
                  console.log(`Failed to delete artifact ${artifact.name}: ${error.message}`);
                }
              }
            }