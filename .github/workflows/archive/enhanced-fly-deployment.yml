name: 🚀 Enhanced Fly.io Deployment Pipeline

on:
  push:
    branches: [main, feat/realtime-swarm-control]
    paths:
      - 'apps/manager/**'
      - 'apps/worker/**'
      - 'shared/**'
      - '.github/workflows/enhanced-fly-deployment.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        type: choice
        options: ['manager', 'worker', 'all']
        default: 'all'
      environment:
        description: 'Target environment'
        type: choice
        options: ['production', 'staging']
        default: 'production'
      skip_tests:
        description: 'Skip test execution (emergency only)'
        type: boolean
        default: false
      force_deploy:
        description: 'Force deployment (override health checks)'
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  FLY_ORG: swarm-manager
  DEPLOYMENT_TIMEOUT: 300
  HEALTH_CHECK_TIMEOUT: 600
  ROLLBACK_TIMEOUT: 180

jobs:
  pre-deployment-validation:
    name: 🔍 Pre-Deployment Validation
    runs-on: ubuntu-latest
    outputs:
      should_deploy_manager: ${{ steps.changes.outputs.manager }}
      should_deploy_worker: ${{ steps.changes.outputs.worker }}
      deployment_strategy: ${{ steps.strategy.outputs.strategy }}
      migration_required: ${{ steps.migration.outputs.required }}
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 🔍 Detect Service Changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            manager:
              - 'apps/manager/**'
              - 'shared/**'
              - 'supabase/migrations/**'
            worker:
              - 'apps/worker/**'
              - 'shared/**'
      
      - name: 🎯 Determine Deployment Strategy
        id: strategy
        run: |
          if [ "${{ github.event.inputs.service }}" = "manager" ] || [ "${{ steps.changes.outputs.manager }}" = "true" ]; then
            echo "manager=true" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.event.inputs.service }}" = "worker" ] || [ "${{ steps.changes.outputs.worker }}" = "true" ]; then
            echo "worker=true" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.event.inputs.service }}" = "all" ]; then
            echo "manager=true" >> $GITHUB_OUTPUT
            echo "worker=true" >> $GITHUB_OUTPUT
          fi
          
          # Determine deployment strategy based on changes
          if [ "${{ steps.changes.outputs.manager }}" = "true" ] && [ "${{ steps.changes.outputs.worker }}" = "true" ]; then
            echo "strategy=sequential" >> $GITHUB_OUTPUT
          else
            echo "strategy=rolling" >> $GITHUB_OUTPUT
          fi
      
      - name: 🗃️ Check Migration Requirements
        id: migration
        run: |
          # Check if there are new migration files
          if git diff --name-only HEAD~1 HEAD | grep -q "supabase/migrations/"; then
            echo "required=true" >> $GITHUB_OUTPUT
            echo "🗃️ Database migrations detected"
          else
            echo "required=false" >> $GITHUB_OUTPUT
            echo "📄 No database migrations required"
          fi
      
      - name: 📊 Deployment Summary
        run: |
          echo "## 🚀 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Action | Strategy |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Manager API | ${{ steps.strategy.outputs.manager && '✅ Deploy' || '⏭️ Skip' }} | ${{ steps.strategy.outputs.strategy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker Service | ${{ steps.strategy.outputs.worker && '✅ Deploy' || '⏭️ Skip' }} | ${{ steps.strategy.outputs.strategy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ steps.migration.outputs.required && '🗃️ Migrate' || '📄 No Changes' }} | automatic |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment ID**: ${{ env.DEPLOYMENT_ID }}" >> $GITHUB_STEP_SUMMARY

  code-quality-gate:
    name: 🧪 Code Quality Gate
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: 📦 Install pnpm
        run: npm install -g pnpm
      
      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 🔍 Lint & Type Check
        run: |
          echo "🔍 Running lint checks..."
          pnpm run lint --workspace=apps/manager --workspace=apps/worker
          
          echo "📝 Running type checks..."
          pnpm run build --workspace=shared/types
          pnpm run build --workspace=apps/manager --workspace=apps/worker
      
      - name: 🧪 Unit & Integration Tests
        run: |
          echo "🧪 Running unit tests..."
          pnpm run test --workspace=apps/manager --workspace=apps/worker
          
          echo "🔗 Running integration tests..."
          pnpm run test:integration --workspace=apps/manager || echo "No integration tests found"
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
      
      - name: 🔐 Security Audit
        run: |
          echo "🔐 Running security audit..."
          pnpm audit --audit-level moderate
          
          echo "🔍 Checking for known vulnerabilities..."
          npx retire --exitwith 1 || true
      
      - name: 📊 Test Coverage
        run: |
          echo "📊 Generating test coverage..."
          pnpm run test:coverage --workspace=apps/manager || echo "Coverage not configured"

  database-migration:
    name: 🗃️ Database Migration
    needs: [pre-deployment-validation, code-quality-gate]
    if: needs.pre-deployment-validation.outputs.migration_required == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Supabase CLI
        run: |
          curl -sSfL https://github.com/supabase/cli/releases/download/v1.142.2/supabase_1.142.2_linux_amd64.tar.gz | tar -xz
          sudo mv supabase /usr/local/bin/
      
      - name: 🗃️ Backup Database
        run: |
          echo "🗃️ Creating database backup before migration..."
          # Create backup using Supabase CLI or custom backup script
          echo "Backup created with timestamp: $(date)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      
      - name: 🚀 Run Database Migrations
        run: |
          echo "🚀 Applying database migrations..."
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      
      - name: ✅ Verify Migration Success
        run: |
          echo "✅ Verifying migration success..."
          # Add migration verification logic here
          echo "Migration verification completed"

  deploy-manager:
    name: 🖥️ Deploy Manager API
    needs: [pre-deployment-validation, code-quality-gate, database-migration]
    if: always() && needs.pre-deployment-validation.outputs.should_deploy_manager == 'true' && (needs.code-quality-gate.result == 'success' || needs.code-quality-gate.result == 'skipped') && (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: 📊 Pre-Deployment Health Check
        run: |
          echo "📊 Checking current deployment health..."
          flyctl status --app swarm-manager-live || echo "App not running"
          
          # Get current version for rollback reference
          CURRENT_VERSION=$(flyctl releases --app swarm-manager-live --limit 1 --format json | jq -r '.[0].version' 2>/dev/null || echo "none")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "Current version: $CURRENT_VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🏗️ Build and Deploy Manager
        timeout-minutes: ${{ fromJson(env.DEPLOYMENT_TIMEOUT) }}
        run: |
          echo "🏗️ Building and deploying Manager API..."
          cd apps/manager
          
          # Deploy with rolling strategy and health checks
          flyctl deploy \
            --app swarm-manager-live \
            --build-arg NODE_ENV=production \
            --strategy rolling \
            --wait-timeout ${DEPLOYMENT_TIMEOUT}s \
            --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: ⏱️ Wait for Deployment Stabilization
        run: |
          echo "⏱️ Waiting for deployment to stabilize..."
          sleep 45
      
      - name: 🩺 Comprehensive Health Checks
        timeout-minutes: ${{ fromJson(env.HEALTH_CHECK_TIMEOUT) }}
        run: |
          echo "🩺 Running comprehensive health checks..."
          
          # Function to check API health
          check_api_health() {
            local endpoint=$1
            local max_attempts=20
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Health check attempt $attempt/$max_attempts for $endpoint"
              
              # Basic health check
              if curl -f --max-time 10 "https://swarm-manager-live.fly.dev$endpoint"; then
                echo "✅ $endpoint health check passed!"
                return 0
              else
                echo "❌ $endpoint health check failed (attempt $attempt/$max_attempts)"
                if [ $attempt -eq $max_attempts ]; then
                  return 1
                fi
                sleep 15
                attempt=$((attempt + 1))
              fi
            done
          }
          
          # Check all critical endpoints
          check_api_health "/health" || exit 1
          check_api_health "/health/ready" || exit 1
          check_api_health "/api/health" || exit 1
          
          echo "🎯 All health checks passed!"
      
      - name: 🧪 API Functionality Tests
        run: |
          echo "🧪 Running API functionality tests..."
          
          # Test basic API endpoints
          echo "Testing swarm status endpoint..."
          SWARM_STATUS=$(curl -s --max-time 10 "https://swarm-manager-live.fly.dev/api/swarms" | jq -r '.status' 2>/dev/null || echo "error")
          echo "Swarm status response: $SWARM_STATUS"
          
          # Test WebSocket connection
          echo "Testing WebSocket connectivity..."
          timeout 10s node -e "
            const WebSocket = require('ws');
            const ws = new WebSocket('wss://swarm-manager-live.fly.dev');
            ws.on('open', () => { console.log('✅ WebSocket connection successful'); process.exit(0); });
            ws.on('error', (error) => { console.log('❌ WebSocket connection failed:', error.message); process.exit(1); });
            setTimeout(() => { console.log('❌ WebSocket connection timeout'); process.exit(1); }, 8000);
          " || echo "⚠️ WebSocket test skipped"
          
          echo "✅ API functionality tests completed"
      
      - name: 📊 Performance Validation
        run: |
          echo "📊 Running performance validation..."
          
          # Response time test
          start_time=$(date +%s%N)
          curl -f --max-time 5 https://swarm-manager-live.fly.dev/health > /dev/null 2>&1
          end_time=$(date +%s%N)
          response_time=$(( (end_time - start_time) / 1000000 ))
          
          echo "API response time: ${response_time}ms"
          
          # Performance thresholds
          if [ $response_time -lt 1000 ]; then
            echo "✅ Performance validation passed (< 1000ms)"
          elif [ $response_time -lt 2000 ]; then
            echo "⚠️ Performance warning (${response_time}ms - acceptable but slow)"
          else
            echo "❌ Performance validation failed (${response_time}ms - too slow)"
            if [ "${{ github.event.inputs.force_deploy }}" != "true" ]; then
              exit 1
            fi
          fi
      
      - name: 🚨 Setup Monitoring Alerts
        run: |
          echo "🚨 Activating deployment monitoring..."
          
          # Trigger observability monitoring for this deployment
          curl -X POST "https://swarm-manager-live.fly.dev/api/observability/deployment" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_id\": \"${{ env.DEPLOYMENT_ID }}\",
              \"service\": \"manager\",
              \"version\": \"$(git rev-parse --short HEAD)\",
              \"environment\": \"${{ github.event.inputs.environment || 'production' }}\",
              \"github_run_id\": \"${{ github.run_id }}\"
            }" \
            --max-time 10 || echo "⚠️ Monitoring setup failed (non-critical)"
          
          echo "📊 Monitoring alerts activated for deployment"

  deploy-worker:
    name: ⚙️ Deploy Worker Service
    needs: [pre-deployment-validation, code-quality-gate, database-migration, deploy-manager]
    if: always() && needs.pre-deployment-validation.outputs.should_deploy_worker == 'true' && (needs.code-quality-gate.result == 'success' || needs.code-quality-gate.result == 'skipped') && (needs.database-migration.result == 'success' || needs.database-migration.result == 'skipped') && (needs.deploy-manager.result == 'success' || needs.deploy-manager.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: 📊 Pre-Deployment Status
        run: |
          echo "📊 Checking current worker status..."
          flyctl status --app swarm-worker || echo "Worker not running"
          
          CURRENT_VERSION=$(flyctl releases --app swarm-worker --limit 1 --format json | jq -r '.[0].version' 2>/dev/null || echo "none")
          echo "worker_current_version=$CURRENT_VERSION" >> $GITHUB_ENV
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🏗️ Deploy Worker Service
        timeout-minutes: ${{ fromJson(env.DEPLOYMENT_TIMEOUT) }}
        run: |
          echo "⚙️ Deploying Worker Service..."
          cd apps/worker
          
          flyctl deploy \
            --app swarm-worker \
            --build-arg NODE_ENV=production \
            --strategy rolling \
            --wait-timeout ${DEPLOYMENT_TIMEOUT}s \
            --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🩺 Worker Health Validation
        timeout-minutes: 5
        run: |
          echo "🩺 Validating worker deployment..."
          max_attempts=20
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Worker health check attempt $attempt/$max_attempts"
            
            # Check worker status via Fly CLI
            if flyctl status --app swarm-worker | grep -q "started\|running"; then
              echo "✅ Worker service is running!"
              
              # Additional worker functionality check
              flyctl logs --app swarm-worker --limit 10
              echo "✅ Worker deployment successful!"
              break
            else
              echo "❌ Worker check failed (attempt $attempt/$max_attempts)"
              if [ $attempt -eq $max_attempts ]; then
                echo "💥 Worker deployment failed"
                exit 1
              fi
              sleep 15
              attempt=$((attempt + 1))
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  post-deployment-validation:
    name: 🔍 Post-Deployment System Validation
    needs: [deploy-manager, deploy-worker]
    if: always() && (needs.deploy-manager.result == 'success' || needs.deploy-worker.result == 'success')
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🧪 End-to-End Integration Tests
        run: |
          echo "🧪 Running end-to-end integration tests..."
          
          # Test Manager API if deployed
          if [ "${{ needs.deploy-manager.result }}" == "success" ]; then
            echo "Testing Manager API integration..."
            
            # Health check
            if curl -f --max-time 10 https://swarm-manager-live.fly.dev/health; then
              echo "✅ Manager API integration test passed"
            else
              echo "❌ Manager API integration test failed"
            fi
            
            # WebSocket test
            timeout 10s node -e "
              const WebSocket = require('ws');
              const ws = new WebSocket('wss://swarm-manager-live.fly.dev');
              ws.on('open', () => { 
                console.log('✅ WebSocket integration test passed'); 
                ws.close();
                process.exit(0); 
              });
              ws.on('error', (error) => { 
                console.log('❌ WebSocket integration test failed:', error.message); 
                process.exit(1); 
              });
              setTimeout(() => { 
                console.log('❌ WebSocket integration timeout'); 
                process.exit(1); 
              }, 8000);
            " || echo "⚠️ WebSocket integration test failed"
          fi
          
          # Test Worker service if deployed
          if [ "${{ needs.deploy-worker.result }}" == "success" ]; then
            echo "Testing Worker service integration..."
            # Add worker-specific integration tests here
            echo "✅ Worker integration tests completed"
          fi
      
      - name: 📊 System Performance Validation
        run: |
          echo "📊 Running system performance validation..."
          
          # Load test simulation
          echo "Simulating load test..."
          for i in {1..5}; do
            start_time=$(date +%s%N)
            curl -f --max-time 5 https://swarm-manager-live.fly.dev/health > /dev/null 2>&1
            end_time=$(date +%s%N)
            response_time=$(( (end_time - start_time) / 1000000 ))
            echo "Request $i: ${response_time}ms"
          done
          
          echo "✅ Performance validation completed"
      
      - name: 🚨 Activate Production Monitoring
        run: |
          echo "🚨 Activating production monitoring..."
          
          # Notify monitoring systems of successful deployment
          curl -X POST "https://swarm-manager-live.fly.dev/api/observability/deployment-complete" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_id\": \"${{ env.DEPLOYMENT_ID }}\",
              \"status\": \"success\",
              \"manager_deployed\": \"${{ needs.deploy-manager.result == 'success' }}\",
              \"worker_deployed\": \"${{ needs.deploy-worker.result == 'success' }}\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }" \
            --max-time 10 || echo "⚠️ Monitoring notification failed (non-critical)"
          
          echo "📊 Production monitoring activated"
      
      - name: 🎯 Deployment Success Summary
        run: |
          echo "## 🎯 Deployment Success Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL | Health |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-manager.result }}" == "success" ]; then
            echo "| Manager API | ✅ Deployed | https://swarm-manager-live.fly.dev | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-manager.result }}" == "skipped" ]; then
            echo "| Manager API | ⏭️ Skipped | https://swarm-manager-live.fly.dev | ➖ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-worker.result }}" == "success" ]; then
            echo "| Worker Service | ✅ Deployed | swarm-worker.fly.dev | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-worker.result }}" == "skipped" ]; then
            echo "| Worker Service | ⏭️ Skipped | swarm-worker.fly.dev | ➖ N/A |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: ${{ env.DEPLOYMENT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed At**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: ${{ needs.pre-deployment-validation.outputs.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Monitor application performance for the next 30 minutes" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify user-facing functionality" >> $GITHUB_STEP_SUMMARY
          echo "3. Check observability dashboards for any anomalies" >> $GITHUB_STEP_SUMMARY

  automatic-rollback:
    name: 🔄 Automatic Rollback
    needs: [pre-deployment-validation, deploy-manager, deploy-worker, post-deployment-validation]
    if: failure() && !github.event.inputs.force_deploy && (needs.deploy-manager.result == 'failure' || needs.deploy-worker.result == 'failure' || needs.post-deployment-validation.result == 'failure')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: 🚨 Rollback Notification
        run: |
          echo "## 💥 AUTOMATIC ROLLBACK INITIATED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Deployment failed - automatic rollback in progress**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Deployment Status | Rollback Action |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------------|-----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Manager API | ${{ needs.deploy-manager.result }} | ${{ needs.deploy-manager.result == 'failure' && '🔄 Rolling back' || '➖ No action' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker Service | ${{ needs.deploy-worker.result }} | ${{ needs.deploy-worker.result == 'failure' && '🔄 Rolling back' || '➖ No action' }} |" >> $GITHUB_STEP_SUMMARY
      
      - name: 🔄 Rollback Manager API
        if: needs.deploy-manager.result == 'failure'
        timeout-minutes: ${{ fromJson(env.ROLLBACK_TIMEOUT) }}
        run: |
          echo "🔄 Rolling back Manager API..."
          
          # Get previous version if available
          PREVIOUS_VERSION=$(flyctl releases --app swarm-manager-live --limit 2 --format json | jq -r '.[1].version' 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "null" ]; then
            echo "Rolling back to version: $PREVIOUS_VERSION"
            flyctl releases rollback --app swarm-manager-live --to $PREVIOUS_VERSION
          else
            echo "Rolling back to previous release"
            flyctl releases rollback --app swarm-manager-live
          fi
          
          # Wait for rollback to complete
          sleep 30
          
          # Verify rollback success
          if curl -f --max-time 10 https://swarm-manager-live.fly.dev/health; then
            echo "✅ Manager API rollback successful"
          else
            echo "❌ Manager API rollback failed - manual intervention required"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🔄 Rollback Worker Service
        if: needs.deploy-worker.result == 'failure'
        timeout-minutes: ${{ fromJson(env.ROLLBACK_TIMEOUT) }}
        run: |
          echo "🔄 Rolling back Worker Service..."
          
          PREVIOUS_VERSION=$(flyctl releases --app swarm-worker --limit 2 --format json | jq -r '.[1].version' 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "null" ]; then
            echo "Rolling back to version: $PREVIOUS_VERSION"
            flyctl releases rollback --app swarm-worker --to $PREVIOUS_VERSION
          else
            echo "Rolling back to previous release"
            flyctl releases rollback --app swarm-worker
          fi
          
          # Wait for rollback to complete
          sleep 30
          
          # Verify rollback success
          if flyctl status --app swarm-worker | grep -q "started\|running"; then
            echo "✅ Worker Service rollback successful"
          else
            echo "❌ Worker Service rollback failed - manual intervention required"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 🚨 Post-Rollback Validation
        run: |
          echo "🚨 Validating system health after rollback..."
          
          # Test Manager API if it was rolled back
          if [ "${{ needs.deploy-manager.result }}" == "failure" ]; then
            if curl -f --max-time 10 https://swarm-manager-live.fly.dev/health; then
              echo "✅ Manager API responding after rollback"
            else
              echo "❌ Manager API not responding after rollback - CRITICAL"
            fi
          fi
          
          # Test Worker service if it was rolled back
          if [ "${{ needs.deploy-worker.result }}" == "failure" ]; then
            if flyctl status --app swarm-worker | grep -q "started\|running"; then
              echo "✅ Worker Service responding after rollback"
            else
              echo "❌ Worker Service not responding after rollback - CRITICAL"
            fi
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: 📧 Failure Notification
        run: |
          echo "## 💥 DEPLOYMENT FAILURE REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Deployment failed and automatic rollback was executed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Failure Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: ${{ env.DEPLOYMENT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed At**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Status**: Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Failed Services" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-manager.result }}" == "failure" ]; then
            echo "- Manager API deployment" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy-worker.result }}" == "failure" ]; then
            echo "- Worker Service deployment" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.post-deployment-validation.result }}" == "failure" ]; then
            echo "- Post-deployment validation" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Required Actions" >> $GITHUB_STEP_SUMMARY
          echo "1. Review deployment logs for error details" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify rollback completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "3. Fix issues before attempting next deployment" >> $GITHUB_STEP_SUMMARY
          echo "4. Consider running manual testing before next deployment" >> $GITHUB_STEP_SUMMARY
          echo "5. Update monitoring thresholds if needed" >> $GITHUB_STEP_SUMMARY