name: 🔒 Security Scanning & Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - dependencies
          - secrets
          - container
          - api

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dependencies' || github.event_name != 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run pnpm audit
        run: |
          pnpm audit --audit-level moderate --json > pnpm-audit.json || true
          echo "📊 Dependency audit completed"

      - name: 🛡️ Run Snyk vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --json > snyk-report.json

      - name: 📊 Generate dependency report
        run: |
          node scripts/security/dependency-report.js
          echo "📋 Dependency vulnerability report generated"

      - name: 📤 Upload dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: |
            pnpm-audit.json
            snyk-report.json
            dependency-security-report.html

  secret-scan:
    name: 🔐 Secret & Credential Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'secrets' || github.event_name != 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for secrets with TruffleHog
        uses: trufflesecurity/truffleHog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --json --no-verification > trufflehog-results.json

      - name: 🔐 GitLeaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🔒 Custom secret pattern scan
        run: |
          node scripts/security/secret-scanner.js
          echo "🔍 Custom secret pattern scan completed"

      - name: 📤 Upload secret scan reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: |
            trufflehog-results.json
            gitleaks-report.json
            custom-secret-scan.json

  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'container' || github.event_name != 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Build containers for scanning
        run: |
          docker build -t swarm-manager:scan -f apps/manager/Dockerfile apps/manager/
          docker build -t swarm-dashboard:scan -f dashboard/Dockerfile dashboard/
          docker build -t swarm-worker:scan -f worker/Dockerfile worker/

      - name: 🔍 Scan Manager container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'swarm-manager:scan'
          format: 'sarif'
          output: 'manager-container-scan.sarif'

      - name: 🔍 Scan Dashboard container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'swarm-dashboard:scan'
          format: 'sarif'
          output: 'dashboard-container-scan.sarif'

      - name: 🔍 Scan Worker container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'swarm-worker:scan'
          format: 'sarif'
          output: 'worker-container-scan.sarif'

      - name: 📊 Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '.'

      - name: 📤 Upload detailed reports
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            *-container-scan.sarif

  api-security-test:
    name: 🔗 API Security Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'api' || github.event_name != 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Start test environment
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: 🔒 Run OWASP ZAP API security scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:3001'
          format: openapi
          api_specification: 'api-spec.yml'

      - name: 🧪 Custom API security tests
        run: |
          node tests/security/api-security-tests.js
          echo "🔒 API security tests completed"

      - name: 📊 Generate security report
        run: |
          node scripts/security/api-security-report.js
          echo "📋 API security report generated"

      - name: 🧹 Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down

      - name: 📤 Upload API security reports
        uses: actions/upload-artifact@v4
        with:
          name: api-security-reports
          path: |
            zap-report.html
            api-security-test-results.json
            api-security-report.html

  compliance-check:
    name: 📋 Compliance & Policy Check
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'full' || github.event_name != 'workflow_dispatch'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 GDPR compliance check
        run: |
          node scripts/security/gdpr-compliance-check.js
          echo "🇪🇺 GDPR compliance check completed"

      - name: 🛡️ SOC2 compliance scan
        run: |
          node scripts/security/soc2-compliance-check.js
          echo "🏢 SOC2 compliance check completed"

      - name: 🔐 Security policy validation
        run: |
          node scripts/security/security-policy-check.js
          echo "📋 Security policy validation completed"

      - name: 📤 Upload compliance reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: |
            gdpr-compliance-report.json
            soc2-compliance-report.json
            security-policy-report.json

  security-summary:
    name: 📊 Security Summary & Notification
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, container-scan, api-security-test, compliance-check]
    if: always()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⬇️ Download all security reports
        uses: actions/download-artifact@v4

      - name: 📊 Generate comprehensive security report
        run: |
          node scripts/security/comprehensive-security-report.js
          echo "📋 Comprehensive security report generated"

      - name: 🚨 Check for critical vulnerabilities
        id: critical-check
        run: |
          CRITICAL_COUNT=$(node scripts/security/count-critical-vulns.js)
          echo "critical_vulns=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "🚨 $CRITICAL_COUNT critical vulnerabilities found!"
            exit 1
          fi

      - name: 🔔 Security notification (success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: 'good'
          channel: '#security'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: |
            ✅ Security scan completed successfully
            🔍 No critical vulnerabilities found
            📊 Full report available in GitHub Actions artifacts

      - name: 🚨 Security alert (failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'danger'
          channel: '#security-alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: |
            🚨 CRITICAL SECURITY VULNERABILITIES FOUND
            💥 Critical vulnerabilities: ${{ steps.critical-check.outputs.critical_vulns }}
            🔗 Immediate action required: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 📤 Upload final security report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-security-report
          path: |
            comprehensive-security-report.html
            security-summary.json